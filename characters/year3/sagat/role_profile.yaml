  - 'High Tiger Shot后必须继续看跳；fireball不是注意力结束点。'
  - '2MK不可取消，不能套用Ryu/Ken/Luke的2MK DRC骨架。'
  - 'H Tiger Knee +42 safe jump必须标明airborne-hit condition。'
  - 'Tiger Nexus follow-up是独立分支，不是一条万能安全字符串。'
