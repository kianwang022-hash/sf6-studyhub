  signature_mechanic:
    name: 'Projectile-to-contact space conversion'
    rule: 'Tiger Shot先改变对手移动；真正收益由长normal、Uppercut/Knee击倒与后续Oki兑现。fireball数量本身不是目标。'
  key_numbers:
