schema_version: '1.0'
character: sagat
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Sagat用Tiger Shot限制对手怎么动，再用长中拳脚和Tiger Uppercut抓那个被迫的移动；真正收益是把空间控制换成高价值击倒和下一轮。'
    preferred_range: '中远距离先用High Tiger Shot改变前走/跳跃节奏；对手进入长拳脚范围后，用5MP、2MP、5MK、6HK占位并兑现。'
    win_pattern: 'Tiger Shot塑造移动 -> 继续看跳 -> 5MP/2MP/5MK抓反应 -> Uppercut/Knee击倒 -> +2打投或safe-jump -> 再决定继续发波还是站normal位置。'
    lose_pattern: '机械连发火球不看跳、对手已经进长拳脚距离仍继续发波、把Tiger Knee帧差背成固定值、把所有H Knee命中都当+42 safe jump。'
  character_model:
    essence_short: 'Sagat的火球不是终点，而是用来限制对手“怎么走”；真正的角色循环是火球逼反应 → 长拳脚抓反应 → Uppercut/Knee击倒 → 高价值下一轮。'
    essence_detail: 'Sagat确实比前面的标准角色更重视fireball，但如果把他理解成“站最远一直扔波”就会学歪。Tiger Shot的第一作用是改变对手的移动规则：High Tiger Shot逼他考虑跳、蹲、Perfect Parry、前走节奏和Drive；一旦对手为了处理火球改变位置，Sagat的5MP、2MP、5MK、6HK这些长而有价值的拳脚就更容易接住那个反应。当前Game Plan也反复把火球之后的收益接到medium normal、Tiger Knee / Uppercut击倒、+42 safe jump和5MP block +2的strike/throw上。Sagat真正要学的是“空间限制 → 读反应 → 地面兑现 → 高价值下一轮”，而不是单独提高fireball数量。火球过量、被跳中一次，可能比少发一颗更亏；所以成熟Sagat会不断在继续发波、占长拳脚位置、准备Tiger Uppercut之间切换注意力。'
    force_opponent_to:
    - 'High Tiger Shot让对手不能按原节奏自由前走，必须跳、蹲、PP、parry或改变推进节奏。'
    - 'Tiger Uppercut让对手不能把“看到火球就跳”当免费答案。'
    - '进入中距离后必须尊重5MP block +2与6HK block +4的长距离接触。'
    payoff_after_respect:
    - '更容易用5MP / 2MP / 5MK抓到地面移动。'
    - 'Tiger Uppercut把普通确认换成+27/+32的稳定Oki预算。'
    - 'Tiger Knee在正确spacing/airborne状态下换更大Oki，后期可进入+42 safe jump。'
    - '5MP +2后strike / throw / shimmy真正成立。'
    core_tradeoff: '继续fireball塑造空间 vs 提前站normal位置准备抓移动/跳跃。命中后再比较Uppercut的稳定Oki与Tiger Knee更大但更条件化的Oki预算。'
    successful_round:
    - 'High Tiger Shot改变对手移动节奏'
    - '发波后继续看跳，Tiger Uppercut保证威胁可信'
    - '对手改变移动后用5MP / 2MP / 5MK抓contact'
    - '按位置选Uppercut或Tiger Knee击倒'
    - '用+2打投、DR Oki或safe jump继续'
    - '对手改变答案后重新决定发波还是占normal位置'
    common_misplays:
    - '把zoner理解成一直发波，发波以后不继续看跳。'
    - '对手已经进入5MP/5MK工作区还机械High Tiger Shot。'
    - '把Tiger Knee +36…49范围压成一个固定数字。'
    - '看到H Tiger Knee +42就当所有命中都能safe jump。'
    unique_decision: 'Sagat真正新增的是“projectile先改变movement budget，再用长normal兑现”。注意力要在继续发波、占地面按钮位置和准备Uppercut反空之间动态切换。'
    transfer_in:
    - 'projectile / anti-air框架。'
    - 'strike / throw / shimmy。'
    - 'punish / DI / corner / SA与knockdown -> Oki。'
    new_skill:
    - '用不同Tiger Shot节奏塑造移动，而不是只做chip。'
    - 'fireball后持续保留反空注意力。'
    - '长normal与projectile之间的空间接力。'
    - 'Tiger Knee不同spacing / hit state对应的Oki预算。'
    - '+42 safe jump只在正确airborne-hit条件使用。'
    unlearn:
    - 'zoning等于尽量多发fireball。'
    - '所有标准角色都应该以2MK DRC作为同一种主低段转换。'
    - 'Tiger Knee击倒数字可以脱离距离/命中状态背成固定值。'
  glossary:
  - {term: '236MP/HP｜High Tiger Shot', meaning: '高位Tiger Shot。重点不是弹幕数量，而是逼对手改变前走、跳跃、蹲与parry节奏。'}
  - {term: '236LP｜Low Tiger Shot', meaning: '低位火球，用来改变对手站位/移动选择；被防-7，不能当近距离自动pressure。'}
  - {term: '623P｜Tiger Uppercut', meaning: '主要反空与稳定ender。L版常见+32，M/H常见+27；强度决定伤害/后续。'}
  - {term: '236K｜Tiger Knee Crush', meaning: '前进膝击与高价值ender。击倒优势高度依赖spacing和命中状态，H版特定空中命中才进入+42 safe-jump family。'}
  - {term: '214K｜Tiger Nexus', meaning: '可派生Mighty / Greedy / Nova。每个follow-up风险/后续不同，不是统一安全字符串。'}
  tools:
  - {input: '236MP / 236HP', name: 'High Tiger Shot', use: 'S0空间塑形。M版16F / block +3；H版12F / block -1，用不同节奏逼出移动。'}
  - {input: '623P', name: 'Tiger Uppercut', use: '必须的反空/稳定ender；没有反空，fireball控制就不可信。'}
  - {input: '5MP', name: '站中拳', use: '6F / Hit +6 / Block +2；火球逼出地面移动后最重要的长medium接触之一。'}
  - {input: '2MP', name: '蹲中拳', use: '7F / Hit +4 / Block -1 / C；稳定确认和CDR入口。'}
  - {input: '5MK', name: '站中脚', use: '11F长poke；Year4 target combo接6HK后可进入+38 Oki family。'}
  - {input: '6HK', name: 'Step High Kick', use: '16F / Hit +7 / Block +4；强respect/PC工具，但仍要按距离和对手姿势判断。'}
  - {input: '236K', name: 'Tiger Knee Crush', use: '确认后的大Oki/位置工具；不同强度和命中状态的帧预算不同。'}
  - {input: '214K', name: 'Tiger Nexus', use: '路线与压力分支；Mighty / Greedy / Nova各自独立判断。'}
