schema_version: '1.0'
character: cviper
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Viper先用5MP +1和稳定Thunder Dash击倒跑普通回合；真正新增的是High Jump Cancel——把已经命中的Normal重新路由进special，而不是一开始就把复杂执行当入门门票。'
    preferred_range: '中近距离用5MP/2MK/5MK拿contact；普通opening先收进Thunder Dash/Tracer，价值更高时再花Drive用HJC升级conversion。'
    win_pattern: 'ground contact -> confirmed Thunder Dash/Tracer knockdown -> +4..5 strike/throw/low -> one HJC reroute when worth it -> Seismic/Burning Kick carry or setplay -> exact-state jump-in -> SA install/cashout。'
    lose_pattern: '先练最大HJC长连、忘记HJC和Tracer都吃Drive、2HK也硬套HJC、H Thunder Dash裸交、Burning Kick命中/被防都按同一follow-up、泛化+42/+44/+45。'
  character_model:
    essence_short: '先跑普通+1 pressure与稳定击倒；opening值得时，再用HJC把Normal重写成special route。'
    essence_detail: 'C. Viper不是“操作越难越像Viper”。她的第一层仍然是普通SF6：5MP被防+1后做2LP、throw、shimmy；light确认到H Thunder Dash再接Tracer Combination，可以拿到约+25击倒，dash后还有+4..+5继续strike/throw。角色真正独特的是High Jump Cancel：除2HK和unique attacks外，多数ground normal都能在hit/block后取消到High Jump，而High Jump的pre-jump又能special cancel，于是原本不能直接special-cancel的5MK、2MK、5HP也能被重新接进Thunder Dash、Seismic Hammer等route。Year4把5MK提高到Hit +5，2MK也保留Hit +5/-1，让这套cancel grammar更实战。成熟Viper不是每次都走最复杂HJC，而是按opening价值决定：最稳route、Drive换conversion、Seismic launcher、Burning Kick hit/block分支，还是保留资源和位置。'
    force_opponent_to:
    - '尊重5MP Block +1后的2LP / throw / shimmy。'
    - 'H Thunder Dash -> Tracer击倒后处理dash +4..+5下一拍。'
    - '不能只靠后退躲中距离，因为2MK/5MK可以通过HJC转special route。'
    - 'Seismic Hammer命中后必须处理air conversion与setplay。'
    - 'Burning Kick被防后必须考虑Double Burn；命中则考虑Knuckled Pursuit。'
    create_respect_with:
    - '5MP Block +1。'
    - '2LP > 2LP > 5LK > H Thunder Dash > Tracer。'
    - 'Year4 5MK > 5LK > M Thunder Dash。'
    - 'H Tracer +25..26后的dash Oki。'
    - '2MK HJC route作为低段conversion威胁。'
    payoff_after_respect:
    - '5MK / 2MK / 5HP等可通过HJC重新接入special。'
    - 'Seismic Hammer launch可转air Burning Kick / Thunder Dash / carry。'
    - 'Burning Kick按hit/block选择Knuckled Pursuit或Double Burn。'
    - 'exact +42/+44/+45 route可进一步转jump-in/setplay。'
    - 'SA1 install后HJC与special follow-up不再消耗Drive，进入真正高密度Viper。'
    core_tradeoff: '最稳confirm/Oki保存Drive与位置 vs 花Drive用HJC/Tracer买conversion、carry和setplay；复杂度只有买到明确价值时才值得。'
    successful_round:
    - '5MP / 2MK / 5MK拿ground contact'
    - '稳定opening收进Thunder Dash / Tracer'
    - 'dash后用5MP / throw / 2MK继续respect'
    - '高价值opening才切一条已练熟HJC route'
    - 'Seismic/Burning Kick拿carry或exact setplay'
    - 'SA1 install与最大route最后再打开'
    common_misplays:
    - '入门先练最大HJC route，基础+1/Oki不会。'
    - '把HJC当免费special cancel。'
    - '说所有normal都能HJC，忽略2HK/unique exceptions。'
    - 'H Thunder Dash没确认就裸交。'
    - 'Burning Kick hit/block用同一个follow-up。'
    - '把+42/+44/+45当通用Viper数字。'
    unique_decision: 'Viper新增的是cancel-routing grammar：normal可先HJC，再在pre-jump取消到special，把“能不能special cancel”变成Drive与执行选择。'
    transfer_in:
    - 'grounded spacing。'
    - 'strike / throw / shimmy。'
    - 'knockdown -> Oki。'
    - 'Drive价值判断。'
    - 'Chun-Li式的route grammar优先于背全招。'
    new_skill:
    - 'High Jump Cancel input / Drive ownership。'
    - 'normal -> HJC -> special route。'
    - 'Thunder Dash -> Tracer resource/Oki package。'
    - 'Burning Kick hit vs block follow-up split。'
    - 'Seismic Hammer air conversion。'
    - 'exact-state jump-in/setplay ownership。'
    unlearn:
    - '不能直接special cancel的normal就不能进special。'
    - '复杂route永远更好。'
    - 'HJC免费。'
    - '所有normal都能HJC。'
    - 'Burning Kick只有一个follow-up。'
  glossary:
  - {term: 'HJC｜High Jump Cancel', meaning: 'Normal命中/被防后取消到High Jump，再在pre-jump取消special；SA1外会消耗Drive。'}
  - {term: '214P｜Thunder Dash', meaning: '主要conversion/移动special。H版7F但Block -24；必须确认。'}
  - {term: '6+PP｜Tracer Combination', meaning: '普通Thunder Dash后的Drive follow-up；不同Dash强度对应不同击倒。OD Thunder Dash不能接。'}
  - {term: '236K｜Burning Kick', meaning: 'Hit后Knuckled Pursuit；Block后Double Burn +2。分支不能混。'}
  - {term: '623P｜Seismic Hammer', meaning: '低位launcher / setplay owner；普通KD +53，OD当前Block -8。'}
  tools:
  - {input: '5MP', name: '站中拳', use: '8F / Hit +6 / Block +1 / C+HJC；普通pressure核心。'}
  - {input: '5MK', name: '站中脚', use: '8F / Hit +5 / Block -3 / HJC；Year4稳定link与HJC starter。'}
  - {input: '2MK', name: '蹲中脚', use: '8F / Hit +5 / Block -1 / HJC；角色低段conversion，不是普通direct special cancel。'}
  - {input: '214HP', name: 'H Thunder Dash', use: '7F / KD +21 / Block -24；confirmed ender / anti-air-invul special。'}
  - {input: '623P', name: 'Seismic Hammer', use: '24F low / KD +53 / Block -10；air conversion核心。'}
  - {input: '236K', name: 'Burning Kick', use: 'Hit KD +38 / Block -2；follow-up按hit/block分流。'}
