  resource:
    name: 'HJC / Follow-up Drive Budget'
    gain: 'universal Drive Gauge; no character stock.'
    spend: 'HJC costs 1 Drive outside SA1; Tracer / Burning Kick follow-ups also spend Drive.'
    changes: 'Drive converts otherwise non-direct-cancel normals into special routes and upgrades knockdown/carry/setplay.'
    rule: 'S0 sees one HJC route and one Tracer route; full Drive-intensive HJC tree is deferred.'
  signature_mechanic:
    name: 'Drive-owned High Jump Cancel -> pre-jump special rerouting'
    rule: 'normal contact can be HJC-routed into specials; use it only when the added conversion/carry/setplay is worth the Drive and execution.'
