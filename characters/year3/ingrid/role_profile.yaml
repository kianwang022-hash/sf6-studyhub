    gain: 'safe L Sun Flare hold约47F可建立1 stock；更长hold可继续资源行为。'
    spend: 'Sun Flare / Solar Burst的Lv2消耗1 stock，Lv3消耗2 stock；部分SA也与stock level关联。'
