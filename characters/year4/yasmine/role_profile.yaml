    gain: 'normal Alon hit、Talim hit、SA1等当前来源中的取得路径。'
    spend: 'Boosted Alon hit/block通常消费Bayani；OD Boosted Alon命中可重新取得。'
    changes: 'Alon升级为Boosted版本，block安全性与路线收益显著提高；SA2期间约25秒持续Bayani。'
