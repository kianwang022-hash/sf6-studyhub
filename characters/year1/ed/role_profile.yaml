schema_version: '1.0'
character: ed
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Ed先用5MK、5MP和Flicker覆盖普通角色更难碰到的中距离，再把contact收进Blitz击倒；真正的角色循环是Rush重新贴近做strike/throw/shimmy，而不是靠charged Flicker自动贴脸抓。'
    preferred_range: '中距离用5MK/5MP/Flicker找whiff punish和confirm；命中后用M/H Blitz拿击倒，再用Drive Rush/Kill Rush重新进入近身。'
    win_pattern: 'midrange touch -> Blitz knockdown -> Rush re-entry -> strike/low/throw/shimmy -> opponent backs out -> long normal/Flicker catches the escape -> corner safe-jump / +4 pressure -> SA cashout。'
    lose_pattern: '机械Flicker不确认、charged Flicker +4当自动point-blank throw、只会远处甩招不会Blitz后重新贴近、所有H Blitz都写成+42、还沿用旧back throw +24 loop。'
  character_model:
    essence_short: 'Ed用长中距离触角拿contact，再用Blitz击倒和Rush把距离重新压回来；charged Flicker只是后续spacing工具，不是自动投循环。'
    essence_detail: 'Ed不是“没有波动拳的拳击版shoto”。他的5MK、5MP和Psycho Flicker让有效接触距离比普通近身角色更远，但真正稳定的回合不是一直在远处甩Flicker，而是把一次contact转成Psycho Blitz击倒，再用Drive Rush或Kill Rush把距离重新压回近身。M Blitz常见+39、H Blitz+40，H Blitz后DR约+9，于是一次中距离命中可以继续5HP、2MK、throw或shimmy。charged L/M Flicker当前仍Block +4，但Year4明确缩短了拉近距离，所以后续必须看spacing：有时能throw，有时要walk throw，有时更适合5MP或shimmy。5HK本身Block +4又提供了一个不依赖Flicker的稳定近身pressure owner。Psycho Spark/Shoot、Kill Switch、Psycho Knuckle和SA2都应在这个“远处抓人→击倒→重新贴近→对手逃出→再抓回来”的循环稳定后逐层加入。'
    force_opponent_to:
    - '尊重5MK / Flicker覆盖的中距离，不敢随便伸长招。'
    - 'Blitz击倒后处理Rush重新贴近。'
    - '近身时处理5HK +4、5MP、throw与shimmy。'
    - 'charged Flicker被防后按实际距离处理strike / walk throw / shimmy。'
    - 'Psycho Shoot存在时不能只靠后退重置距离。'
    create_respect_with:
    - '2LP > 5LP > M Psycho Blitz稳定confirm。'
    - '5MP > 2LK > M Psycho Blitz。'
    - 'confirmed 5MK > L Psycho Flicker中距离触角。'
    - 'M Blitz +39 -> Drive Rush +8 re-entry。'
    - '5HK Block +4 -> 5MP。'
    payoff_after_respect:
    - 'Rush re-entry后throw / shimmy真正成立。'
    - 'charged Flicker +4可按spacing继续5MP / walk throw / shimmy。'
    - 'Kill Switch把opening换成carry。'
    - 'corner exact +42 safe jump / +38 Spark meaty继续放大。'
    - 'SA2延长damage与corner carry。'
    core_tradeoff: '留在擅长的中距离继续控制，还是把已赚到的contact用Blitz/Rush换成高回报近身；charged Flicker、Knuckle和projectile改变的是下一次接触方式，不应取代基础re-entry。'
    successful_round:
    - '5MK / 5MP / Flicker拿中距离contact'
    - 'M/H Blitz拿稳定击倒'
    - 'Drive Rush / Kill Rush重新贴近'
    - '用strike / low / throw / shimmy逼对手往外逃'
    - '再用长拳/Flicker/Shoot抓回外逃'
    - '进角后safe jump / +4 pressure，SA只在资源值得时cashout'
    common_misplays:
    - 'charged Flicker +4就自动按throw。'
    - '5MK > L Flicker不确认就提交，吃-6。'
    - 'Blitz后不会Rush re-entry，只会回neutral重新猜。'
    - '第一阶段就沉迷Psycho Knuckle蓄力。'
    - '把H Blitz +42 safe jump泛化。'
    - '把back throw继续记成旧+24。'
    unique_decision: 'Ed新增的是range-to-reentry conversion：用更长的中距离触角拿contact，再把它编译成Blitz knockdown和Rush近身回合；对手退出后再回长距离捕捉。'
    transfer_in:
    - 'whiff punish / confirm / anti-air。'
    - 'knockdown -> strike / throw / shimmy。'
    - 'Drive Rush与corner safe jump。'
    - 'projectile spacing纪律。'
    new_skill:
    - '5MK / Flicker中距离触角的confirm纪律。'
    - 'Blitz -> Rush re-entry。'
    - 'charged Flicker +4的spacing判断。'
    - '5HK +4独立pressure owner。'
    - 'Kill Switch作为carry价值分支。'
    - 'Psycho Spark/Shoot速度与屏幕控制。'
    unlearn:
    - 'Flicker +4等于保证贴脸投。'
    - 'Ed只要一直Flicker。'
    - '所有H Blitz都是+42 safe jump。'
    - 'back throw还是+24。'
    - '必须先学Knuckle才像Ed。'
  glossary:
  - {term: '236K｜Psycho Flicker', meaning: '长距离捕捉/confirm工具。普通L/M被防-6；charged L/M当前+4但Year4拉近距离改变，后续按spacing判断。'}
  - {term: '214P｜Psycho Blitz', meaning: '稳定combo ender/knockdown owner。M常见+39，H常见+40。'}
  - {term: 'Kill Rush', meaning: '前后rush移动；forward rush可接Kill Switch Break / Chaser，用于re-entry或carry。'}
  - {term: '236P｜Psycho Spark -> Shoot', meaning: 'projectile control layer；S2以后加入，不替代中距离拳脚。'}
  - {term: 'charged 5HP｜Psycho Knuckle', meaning: 'Lv1/Lv2长蓄力空间工具；S3以后处理不同charge与spacing。'}
  tools:
  - {input: '5MP', name: '站中拳', use: '7F / Hit +6 / Block -1 / C；基础confirm。'}
  - {input: '5MK', name: '站中脚', use: '10F / Hit 0 / Block -5 / C；中距离触角，confirmed hit才接L Flicker。'}
  - {input: '5HK', name: '站重脚', use: '10F / Hit +8 / Block +4 / C；S1稳定近身pressure owner。'}
  - {input: '214MP', name: 'M Psycho Blitz', use: '13F / Block -12；confirmed ender，常见+39。'}
  - {input: '236LK', name: 'L Psycho Flicker', use: '16F / Hit +1 / Block -6；中距离confirm/whiff-punish，不是raw pressure。'}
  - {input: '623LP', name: 'L Psycho Uppercut', use: '10F anti-air / route工具；Block -13，不能乱出。'}
