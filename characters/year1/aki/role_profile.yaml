schema_version: '1.0'
character: aki
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'A.K.I.先用Serpent Lash或毒弹建立毒状态，再靠H Serpent Lash +44把一次普通命中变成高低投/骗拆；对手已中毒后，同一个opening才升级成毒爆、运角与毒池setplay。'
    preferred_range: '中距离用5MK/5MP、Nightshade与Serpent Lash制造接触；命中优先拿H Lash +44，状态成熟后再决定毒爆或运角。'
    win_pattern: 'stable contact -> H Serpent Lash +44 -> two-dash Oki -> opponent poisoned -> next opening becomes burst/carry -> corner Orchid Spring puddle -> punish escape -> SA/lethal cashout。'
    lose_pattern: 'S0就背两套完整毒combo、见毒就机械引爆、把所有Lash击倒值混在一起、裸交高风险special、把毒池+38或+18 meaty泛化。'
  character_model:
    essence_short: '先给毒并拿+44正常起攻；对手已中毒后，再把下一次opening升级成毒爆、运角和毒池setplay。'
    essence_detail: 'A.K.I.不是“毒越多越复杂”的角色。她第一层很简单：light、low或5MK确认到H Serpent Lash，先建立毒状态并拿+44；双dash以后大约还剩+6，可以跑低段、5HK、throw和shimmy。真正的角色变化发生在下一次接触：如果对手已经中毒，M/H/OD Serpent Lash会触发毒爆并改变击倒预算，M可进入约+69、H约+53、OD约+71；这时同一个opening可以延伸伤害、运角，或在角落转成Venomous Fang -> Orchid Spring毒池。Year4又增加了2HP PC上毒和OD Nightshade Chaser普通防御上毒等入口，所以成熟A.K.I.管理的是“现在先建立毒、马上兑现毒爆，还是把优势投资成位置和毒池”，而不是每次都追最高伤害。'
    force_opponent_to:
    - '尊重H Serpent Lash +44后的低段 / strike / throw / shimmy。'
    - '对手已中毒时不能把下一次Lash当普通击倒。'
    - '角落毒池存在时必须考虑jump / walk / reversal离场。'
    - 'Year4 OD Nightshade Chaser普通防御可上毒，迫使对手考虑Drive Parry。'
    create_respect_with:
    - '2LK / 2LP基础确认 -> H Serpent Lash。'
    - '5MK -> 5MP -> H Serpent Lash。'
    - 'H Serpent Lash +44 -> double dash +6。'
    - 'DR low / overhead / 2MK plus contact。'
    - 'exact +18 -> 6HP active meaty。'
    payoff_after_respect:
    - 'poisoned M/H/OD Serpent Lash触发burst并扩大route预算。'
    - '毒爆后可以运角或转Orchid Spring毒池。'
    - 'corner puddle +38 family继续DR高低投/骗拆。'
    - '对手急着离开毒池时，anti-air与whiff punish价值提高。'
    - 'SA2把对手固定在更长时间的poison field里。'
    core_tradeoff: '当前稳定+44 Oki vs 立即用毒爆换damage/route vs 把优势投资到corner与Orchid Spring毒池；poison是状态放大器，不是必须立刻消费的资源。'
    successful_round:
    - '普通contact -> H Serpent Lash建立毒并拿+44'
    - 'double dash后做low / strike / throw / shimmy'
    - '下一次opening检查对手是否已中毒'
    - '已中毒时按位置选择burst、继续循环或运角'
    - '进角后建立Orchid Spring毒池'
    - '惩罚逃毒池行为，再在合适资源下SA cashout'
    common_misplays:
    - '入门就背有毒/无毒所有route。'
    - '对手一中毒就机械引爆，不看位置和Drive。'
    - '把+44/+53/+69/+71混成一个Lash击倒。'
    - '把corner puddle +38当所有Orchid Spring都成立。'
    - '忘记OD Chaser block-poison对Drive Parry有例外。'
    unique_decision: 'A.K.I.新增的是poison-state conversion：同一个opening在未中毒时负责建立状态，已中毒时则能变成burst、carry和setplay。'
    transfer_in:
    - 'normal confirm / strike-throw-shimmy。'
    - 'knockdown -> Oki。'
    - 'projectile / anti-air / Drive Rush。'
    - 'Jamie式的当前回合 vs 未来状态判断。'
    new_skill:
    - 'poisoned / unpoisoned二态识别。'
    - 'poison application vs poison burst route切换。'
    - 'H Lash +44作为基础循环。'
    - 'corner Orchid Spring毒池作为position investment。'
    - 'exact +18/+38/+42/+53/+69/+71 state ownership。'
    unlearn:
    - '系统复杂就该先学完整combo树。'
    - '中毒就必须立即burst。'
    - '所有Serpent Lash共享一个Oki数字。'
    - 'puddle只是DOT，不改变对手移动。'
  glossary:
