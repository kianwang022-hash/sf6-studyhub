  - {input: '5LK', name: '站轻脚', use: '4F / Hit +3 / Block -3 / C；light confirm桥。'}
  - {input: '5MP', name: '站中拳', use: '6F / Hit +3 / Block -3 / C；Toxic Wreath / Drive route starter。'}
  - {input: '5MK', name: '站中脚', use: '8F / Hit +6 / Block -2；S0稳定5MK→5MP→H Lash。'}
  - {input: '2MK', name: '蹲中脚', use: '7F / Hit +5 / Block +1 / SA-only cancel；不要套通用2MK DRC。'}
  - {input: '236HP', name: 'H Serpent Lash', use: '11F / Block -20；confirm后S0核心ender与anti-air，普通hit +44。'}
  - {input: '214MP', name: 'Orchid Spring', use: 'poison-field setplay；S2以后才进入主线。'}
