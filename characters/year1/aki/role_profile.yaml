  - {term: 'poisoned state', meaning: '对手已中毒时，下一次Serpent Lash/Qiong Qi可触发毒爆并改写combo与Oki。'}
  - {term: '214MP｜Orchid Spring', meaning: '建立持续poison field；核心learner setplay在corner exact route后进入。'}
  - {term: '214HP｜Toxic Wreath', meaning: '13F strike / Block -4；常见end state约+40。'}
  - {term: 'OD 214K｜OD Cruel Fate', meaning: '当前hit +42 / block +2 family；S3作为高预算状态使用。'}
