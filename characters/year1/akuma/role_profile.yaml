schema_version: '1.0'
character: akuma
status: CONTENT_READY
role_profile:
  identity:
    one_line: '豪鬼先用完整 shoto 基础把局面做稳，再用空波、蓄波、百鬼和特殊移动去针对对手已经形成的防守；9000 体力要求额外 option 必须有理由。'
    preferred_range: '中距离用 Gou Hadoken、5MP/5HK、2MK 和走位建立普通 shoto 节奏；对手开始固定防守后，再增加空中与百鬼角度。'
    win_pattern: '标准 shoto 控场 -> 稳定确认 / H DP +30 -> 打投骗拆 -> 对手形成固定防守 -> charged fireball / Demon Raid / air fireball 针对 -> 再回基础或继续二层。'
    lose_pattern: '因为招多就每回合乱开 option、只背正帧不看高度/spacing、沿用旧 +42 setplay、忘记 9000 体力导致不值钱的高承诺交换。'
  character_model:
    essence_short: '豪鬼的强点不是“每回合做更多事”，而是标准 shoto 稳定以后能打开更多角度；真正的难点是知道什么时候不用这些额外 option。'
    essence_detail: '豪鬼的普通地面骨架非常完整：236P 豪波动拳控空间、623P 豪升龙反空，2MK 取消绿冲，5MP 被防 +1，H 豪升龙收尾还能给 +30 的稳定起攻。真正属于豪鬼的增量，是在这套标准骨架上多出空中波、蓄力豪波动、百鬼袭、阿修罗闪空、金刚灼火等额外角度，让对手不能只用一种节奏处理你的接近和压制。但这些选择并不免费：豪鬼当前只有 9000 体力，百鬼派生和 charged fireball 的价值也明显依赖高度、距离、蓄力和 setplay 条件。成熟的豪鬼不是不停展示 option，而是先让对手尊重普通地面和 +frame 接触，再用最合适的一种额外 option 针对他的防守习惯；一旦对手开始抢、跳、Perfect Parry 或无敌技，就主动缩回稳定骨架重新读人。'
    force_opponent_to:
    - '先尊重普通 fireball / anti-air 和 5MP +1、5HK +3 的地面接触。'
    - '不能只盯地面路线；空中 Zanku Hadoken 和 Demon Raid 会改变对空与站位。'
    - '在 +30 / +37 等击倒后持续处理 strike / throw / shimmy，而不是只防一条固定脚本。'
    payoff_after_respect:
    - '普通 throw / low / shimmy 更容易成立。'
    - 'charged Gou Hadoken 可以在 setplay 中制造更强 block 状态。'
    - 'Demon Raid follow-up 可以针对站防、蹲防或固定反空节奏。'
    - '多个 end-state 让同一 opening 可以换不同的下一轮时间预算。'
    core_tradeoff: '稳定 shoto 回合 vs 额外 option density。多一层百鬼、空波、蓄波或瞬移只有在它真的针对对手行为时才值得；9000 体力使无理由的高承诺选择成本更高。'
    successful_round:
    - '普通火球 / 地面按钮控节奏'
    - '升龙反空或 2MP / 2MK 拿接触'
    - '先用 H Shoryuken +30 / L Tatsu sweep 建稳定 Oki'
    - '观察对手形成的防守习惯'
    - '再加入 charged fireball / Demon Raid / air fireball'
    - '被针对后缩回基础重新读人'
    common_misplays:
    - '每回合都百鬼、空波、瞬移，反而没有稳定 shoto 骨架。'
    - '把 Demon Raid 某个派生的正帧误记成整个百鬼都正帧。'
    - '继续背旧 +42 L Tatsu sweep，忽略当前 +37 family。'
    - '忘记 9000 体力，用高承诺 option 换很小的收益。'
    unique_decision: '豪鬼新增的是“什么时候值得打开额外 option space”。同一轮既可以维持标准 shoto，也可以用空中、蓄波、百鬼和特殊移动改变对手必须处理的角度；成熟度体现在选择频率而不是招式数量。'
    transfer_in:
    - 'projectile / anti-air / 2MK DRC / strike-throw-shimmy。'
    - 'knockdown -> Oki 与 punish / DI / SA 基础。'
    new_skill:
    - 'option density 管理：何时只用标准答案，何时打开额外角度。'
    - 'Demon Raid 高度 / 派生 / spacing 条件判断。'
    - 'charged fireball 的蓄力时间与 setplay 价值。'
    - '用 9000 health 重新衡量高承诺选择风险。'
    unlearn:
    - '招式更多就应该每回合使用更多招式。'
    - '正帧数字可以脱离高度 / spacing / active-frame 条件单独背。'
    - '旧版本 setplay 数字可以直接沿用。'
  glossary:
  - {term: '236P｜豪波动拳 / Gou Hadoken', meaning: '普通版是 shoto 飞道；蓄力后帧差和节奏改变。先学普通火球，再把蓄力当后置 setplay 层。'}
  - {term: '236K｜百鬼袭 / Demon Raid', meaning: '空中 option family，可接低段、上段/俯冲等不同派生；帧差受派生、高度与落点影响。'}
  - {term: '214P｜金刚灼火 / Adamant Flame', meaning: '路线 / 角落工具。H 版常见 +47 end-state，OD 版还能进入更长 setplay。'}
  - {term: '6KKK / 4KKK｜阿修罗闪空 / Ashura Senku', meaning: '特殊移动/穿过窗口；不是默认 neutral bypass，主要在明确 setplay 或读法里使用。'}
  - {term: '9000 Health｜低体力预算', meaning: '豪鬼当前体力低于标准 10000；这不是“必须冒险”，而是提醒你高承诺 option 需要更高理由。'}
  tools:
  - {input: '5MP', name: '站中拳', use: '6F / Hit +4 / Block +1；最干净的近身 respect 工具之一。'}
  - {input: '5HK', name: '站重脚', use: '13F / Hit +7 / Block +3；强接触但有多段 active / spacing 语义，不能只背 +3。'}
  - {input: '2MP', name: '蹲中拳', use: '6F / Hit +6 / Block -1 / C；稳定地面确认。'}
  - {input: '2MK', name: '蹲中脚', use: '8F / Block -6 / C；主要低段 DRC 入口。'}
  - {input: '236P', name: '豪波动拳 | Gou Hadoken', use: '普通 shoto 空间控制；蓄力等级后置到有 setplay 理由时。'}
  - {input: '623P', name: '豪升龙拳 | Gou Shoryuken', use: '主要反空 / 稳定 ender；H 版常见 +30。'}
  - {input: '236K', name: '百鬼袭 | Demon Raid', use: '针对固定防守习惯的 option family；高度/派生决定结果。'}
  - {input: '214P', name: '金刚灼火 | Adamant Flame', use: '路线与高价值 setplay ender；OD/角落状态后期再展开。'}
