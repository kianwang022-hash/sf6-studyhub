  - 'charged Gou Hadoken 的正帧来自蓄力 / setplay 时间，不是普通火球性质。'
  - 'L Tatsu > 2HK 当前使用 +37 family，禁止把旧 +42 投到前台。'
  - '9000 health 用于风险预算解释，不意味着每回合都要高风险换高回报。'
