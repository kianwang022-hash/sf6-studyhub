  signature_mechanic:
    name: 'Earned mobility + Air Current re-entry'
    rule: '稳定Mixer/Eagle Spike回合先成立；Arabian Cyclone与Air Current只在真实防守习惯出现后增加re-entry角度。'
  key_numbers:
