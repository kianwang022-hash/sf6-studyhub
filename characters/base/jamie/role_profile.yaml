schema_version: '1.0'
character: jamie
status: CONTENT_READY
role_profile:
  identity:
    one_line: '杰米先用正常地面战拿击倒；真正的特色是每次优势都要决定“现在继续压”还是“喝一杯投资未来”。'
    preferred_range: '中近距离。先靠 5MP、2MP、2MK 和轻攻击拿接触；等级提高后再增加新的近身/路线问题。'
    win_pattern: '正常接触 -> 稳定击倒 -> 继续压或安全喝酒 -> 喝酒等级改变下一次可用工具 -> 再回到打/投/资源选择。'
    lose_pattern: '为了赶 Lv4 乱喝酒、Lv0 基础没建立、把每一级当成新的 Combo 清单、只看伤害不看当前 Oki/位置。'
  character_model:
    essence_short: '把每次击倒当成一笔预算：现在继续压，还是牺牲一点当前优势喝一杯，让后面的自己多出新的工具。'
    essence_detail: '杰米不是“喝满以后才开始玩”的角色。Lv0 就应该先靠正常地面按钮、轻攻击、2MK 取消绿冲和稳定反空去打完整的 Street Fighter；喝酒只是把已经成立的回合继续放大。常见的 623K 箭踢收尾能给你稳定击倒，真正属于杰米的决定发生在击倒之后：这次保持位置、继续打/投更值，还是现在拿一个安全窗口喝一杯，把未来的工具箱做大。喝酒等级升高后，不只是伤害数字变化，而是可用问题变多：Lv1 有新的连段/起攻，Lv2 加入 236K Bakkai 路线工具，Lv3 出现 63214K 近身抓取，Lv4 再进入更完整的优化。对手因此也必须开始管你的喝酒窗口。杰米的核心不是“尽快 Lv4”，而是学会用当前回合换未来回合，并且知道什么时候这个交换根本不划算。'
    force_opponent_to:
    - '先尊重 5MP / 轻攻击 / 2MK 的正常地面接触。'
    - '不敢每次击倒后都无脑抢按，从而给你投、近身抓取或安全喝酒窗口。'
    payoff_after_respect:
    - '继续打 / 投 / 骗拆。'
    - '拿一次安全喝酒，把后续工具变多。'
    - 'Lv3 后用 63214K 近身抓取惩罚只会站着防。'
    core_tradeoff: '当前压力与位置 vs 未来喝酒等级。次级取舍是稳定 +39 起攻、+42 更强击倒、角落 +4 压力和资源结果之间怎么选。'
    successful_round:
    - '正常地面接触'
    - '623K 稳定击倒'
    - '判断继续压还是安全喝酒'
    - '等级改变下一次可用威胁'
    - '对手开始针对喝酒/抓取'
    - '回到打 / 投 / 资源循环'
    common_misplays:
    - '见到击倒就喝，明明当前 Oki/位置更值钱。'
    - '觉得 Lv0 不能打，结果基础地面战完全没建立。'
    - '把等级当四套 Combo 清单，而不是未来 option space 的变化。'
    unique_decision: '同一次优势不只决定眼前伤害，还决定要不要把当前回合的一部分价值投资到以后；这是杰米相对标准角色真正多出来的跨回合资源决策。'
    transfer_in:
    - '普通地面确认、反空、2MK 取消绿冲。'
    - '打 / 投 / 骗拆和击倒后起攻。'
    new_skill:
    - '喝酒等级经济：当前优势 vs 未来工具。'
    - '同一 starter 按 end-state 和等级价值分流。'
    unlearn:
    - '资源有机会就一定要攒。'
    - '每次击倒都应该做同一个固定 Oki。'
  glossary:
  - {term: '喝酒等级（Drink Level）', meaning: '喝酒后提高的角色等级；等级越高，后续可用招式/路线越多。不是开局必须先做满的任务。'}
  - {term: '22P｜喝酒动作（The Devil Inside）', meaning: '花时间喝一口来提高喝酒等级；只有窗口足够安全、未来收益值得时才做。'}
  - {term: '236K｜旋转腿路线工具（Bakkai）', meaning: 'Lv2 后可用的必杀；常用于伤害/收尾分流，L 版本可进入 +42 家族。'}
  - {term: '63214K｜近身抓取（Tenshin）', meaning: 'Lv3 后可用，用来惩罚已经愿意站着防的对手。'}
  - {term: 'Oki｜击倒后的起身压制', meaning: '把人打倒后，利用你先恢复的时间安排下一轮打/投/骗拆。'}
  tools:
  - {input: '5MP', name: '中拳接触', use: 'Lv0 就很重要的近身接触；Block +2，先建立对手愿意防的基础。'}
  - {input: '2MP', name: '蹲中拳', use: '6F 可取消的稳定确认按钮，常用于连段和近身转换。'}
  - {input: '2MK', name: '蹲中脚', use: '7F 可取消低段；常见 Drive Rush 入口，被防时不要自动继续。'}
  - {input: '623K', name: '箭踢收尾', use: '稳定击倒家族；常见 H 版本进入 +39 一类下一轮。'}
  - {input: '236K', name: '旋转腿 | Bakkai', use: 'Lv2 后路线工具；L 版本常用于 +42 Oki，具体强度/资源按路线说明。'}
  - {input: '63214K', name: '近身抓取 | Tenshin', use: 'Lv3 后加入；只在已经建立尊重的近身回合真正有价值。'}
  - {input: '22P', name: '喝酒动作', use: '把当前安全窗口换成更高喝酒等级；先比较是否会丢掉更值钱的 Oki/位置。'}
