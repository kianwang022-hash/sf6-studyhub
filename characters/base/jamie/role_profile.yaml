  resource:
    name: '喝酒等级'
    input: '22P'
    gain: '在足够安全的窗口完成喝酒；部分 236P 派生等路线也能提高等级。'
    changes: '等级越高，解锁的新工具越多，并改变部分路线/伤害/后续。'
    rule: '先比较当前 Oki/位置和未来等级收益；不是看到安全窗口就自动喝。'
