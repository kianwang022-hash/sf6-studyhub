  signature_mechanic:
    name: 'Range geometry -> earned knockdown -> covered Teleport proximity conversion'
    rule: '先用长肢/projectile塑造接近；拿到明确knockdown后才forward Teleport/Float进去，把远距结果换成近距frame advantage。'
  key_numbers:
  - {label: 'M Yoga Flame', value: 'KD +33', decision: 'S0 basic close ender。'}
  - {label: 'M Yoga Blast', value: 'KD +42', decision: 'S0 identity route覆盖immediate forward Teleport。'}
  - {label: 'M Blast -> forward P Teleport', value: 'point-blank +3', decision: 'earned close turn；raw Teleport不拥有这个+3。'}
