schema_version: '1.0'
character: lily
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Lily先花时间拿Windclad，再用Windclad Condor Spire把原本-8的高风险进场变成正帧；对手开始尊重这次进场后，5F Mexican Typhoon才真正变成高价值威胁。'
    preferred_range: '中距离用5MK/2MK/长拳脚找contact或资源窗口；安全时拿1层Windclad，之后用Windclad Spire进场，再做strike/throw/command-grab。'
    win_pattern: 'safe Wind window -> gain Windclad -> Windclad Spire plus entry -> strike creates respect -> Mexican Typhoon -> opponent jumps/backwalks -> strike/anti-air/safe jump gets stronger -> rebuild stock when worth it。'
    lose_pattern: '机械攒满3层、没Windclad也把Spire当安全进场、有stock就立刻花、plus entry第一拍总Typhoon、把+52泛化到所有Spire。'
  character_model:
    essence_short: 'Lily的核心不是command grab本身，而是先投资Windclad，把高风险Spire改造成正帧进场；这份plus entry建立respect以后，Mexican Typhoon才值钱。'
    essence_detail: 'Windclad不是有空就越多越好的库存。Condor Wind要付出明显时间窗口才能拿1/2/3层，而normal Condor Spire被防是-8。Windclad存在以后，同一个Spire会变成block +1，OD版+2，同时命中后的Oki从普通+33/+37提升到+47/+49/+52/+56。Current setplay把Windclad H Spire两dash后的状态推进到+10，接着才是strike与Mexican Typhoon的选择。因此Lily真正的第一层决策是“现在是否值得放弃当前节奏去投资Windclad”；第二层才是“有stock以后，这次opening是否值得花掉”；第三层才是“plus entry让对手站防以后，Mexican Typhoon是否值得猜”。成熟Lily不是机械攒满，也不是plus后一律command grab，而是让资源投资、进场和respect形成一条完整因果链。'
    force_opponent_to:
    - '尊重Windclad Condor Spire的正帧进场。'
    - 'Windclad H Spire后处理两dash约+10的strike/throw状态。'
    - '越愿意站防，Mexican Typhoon越可信。'
    - '为了躲Typhoon跳/后退后，strike、anti-air和safe jump重新变强。'
  character_model:
    essence_short: 'Lily先投资Windclad，再把资源换成正帧Spire进场；plus entry建立respect后，Mexican Typhoon才进入高收益猜拳。'
    essence_detail: 'Windclad的真正价值是改写Condor Spire的风险结构：normal Spire被防-8，Windclad L/M/H变成+1，OD变成+2，同时命中后的Oki上升到+47/+49/+52/+56。资源本身要用Condor Wind的长动作去换，因此并不是越多越好。Lily的基础循环应该先学一层Windclad和一次强化Spire，让学习者亲眼看到同一进场从危险变成正帧；等对手开始尊重这次正帧进场，5F Mexican Typhoon才真正成为command-grab回报。'
    force_opponent_to:
    - '尊重Windclad Spire后的正帧接触。'
    - '不能把每次Condor Wind都当免费资源窗口。'
    - '在+47到+56击倒后处理strike/throw/safe-jump。'
    - '对手越愿意block，Mexican Typhoon越强。'
    payoff_after_respect:
    - 'Mexican Typhoon 5F高伤command grab开始成立。'
    - 'Windclad H Spire两dash后+10继续strike/throw。'
    - '+52 exact-state可以进入safe jump。'
    - '对手为躲command grab跳/后退后，anti-air和meaty strike再次变强。'
    core_tradeoff: '现在继续当前压力 vs 花时间投资Windclad；有stock以后再决定现在花还是保留未来plus entry。'
    successful_round:
    - '找安全Condor Wind窗口拿1层Windclad'
    - '用Windclad Spire进场'
    - '先用strike建立respect'
    - '对手开始站防后加入Mexican Typhoon'
    - '对手跳/退以后回strike/anti-air'
    - 'stock耗尽后重新判断是否值得投资'
    common_misplays:
    - '有距离就机械攒到3层。'
    - '没Windclad时把normal Spire当安全pressure。'
    - '有stock就立即花，不看位置和对手。'
    - 'plus entry第一拍总是Mexican Typhoon。'
    - '把+52 safe jump泛化到所有Spire。'
    unique_decision: 'Lily新增的是investment-backed command-grab loop：先用时间/空间换Windclad，再用资源改变进场安全性，最后把respect兑换成Mexican Typhoon。'
    transfer_in:
    - 'Marisa/Honda的respect -> command-grab反馈。'
    - 'grounded spacing / anti-air / strike-throw-shimmy。'
    - 'CDR / punish / corner / Oki。'
    new_skill:
    - 'Windclad stock investment timing。'
    - 'normal vs Windclad Spire风险差异。'
    - 'hold vs spend stock。'
    - '+47/+49/+52/+56 Oki budget。'
    - 'Mexican Typhoon after plus entry。'
    unlearn:
    - '资源应该有空就攒满。'
    - 'command grab是角色第一层。'
    - 'Condor Spire始终安全。'
    - '更多Windclad永远优于当前压力。'
  glossary:
  - {term: '214P｜Condor Wind', meaning: '资源建立工具。Year4有attack版本与hold取stock版本；长按约46/71/90F对应1/2/3层。'}
  - {term: '236K｜Condor Spire', meaning: '进场/route工具。normal被防-8；Windclad L/M/H被防+1，OD +2。'}
  - {term: 'Windclad Stock', meaning: '最多3层；强化Spire、Tomahawk、Dive等。获取有真实时间/空间成本。'}
  - {term: '623P｜Tomahawk Buster', meaning: '主要anti-air/route工具；Windclad版本启动更快。'}
  - {term: '360P｜Mexican Typhoon', meaning: '5F高伤command grab。S1以后在plus-entry respect成立时使用。'}
