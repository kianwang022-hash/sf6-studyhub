schema_version: '1.0'
character: manon
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Manon先用普通strike/throw/Oki赢回合；每拿到一层Medal，未来command grab和Renversé收益更高，对手更想跳/抢/逃，反过来让strike越来越值钱。'
    preferred_range: '中近距离用5MP/5MK/2MP和长unique normal找contact；H Rond-point收尾后跑dash Oki，Renversé负责route/Medal成长，Manège Doré只在read/respect成立时使用。'
    win_pattern: 'ordinary contact -> H Rond-point / Renversé -> dash strike/throw/shimmy -> win one Medal interaction -> future throw reward rises -> opponent escapes grab more -> strike/anti-air value rises -> repeat。'
    lose_pattern: '开局追Medal牺牲position、Medal高以后机械抓、普通throw后dash当guaranteed throw、不同Medal伤害混成固定值、2MK照抄DRC。'
  character_model:
    essence_short: 'Medal不是S0资源任务，而是成功interaction后提高未来收益的长期放大器；越高Medal越应该观察对手如何逃grab，而不是越高越多抓。'
    essence_detail: 'Current Training Priorities先教H Rond-point、st.MP/DR/Renversé、jump-in、DI、anti-air、dash Oki和shimmy，Medal Level甚至排在SA3之后。这说明Manon的基础必须先是普通SF6。Medal的作用是改变未来收益：Manège Doré从Lv1 2000升到Lv5 3700，Renversé和SA3也随Level提高。对手越怕高Medal throw，就越会jump、mash、reversal；Current Medal策略也明确在Lv3到Lv5强调这种逃grab行为。于是高Medal真正带来的不是“更应该抓”，而是strike与anti-air因为对手逃抓而变得更值钱。成熟Manon会根据Medal和对手反应动态重新定价strike、throw、shimmy和稳定damage/Oki。'
    force_opponent_to:
    - '先处理H Rond-point后的dash strike/throw/shimmy。'
    - '普通throw后的dash不是guaranteed throw，必须继续读人。'
    - 'Medal越高，Manège Doré的潜在损失越难忽略。'
    - '对手为躲高Medal grab跳/抢以后，strike和anti-air获得更高回报。'
    payoff_after_respect:
    - 'Manège Doré command grab更容易成立。'
    - '成功Medal interaction继续抬高未来throw/route收益。'
    - '对手越怕grab，jump/mash越多，meaty strike与anti-air越值钱。'
    - 'Renversé把combo route与Medal成长结合。'
    core_tradeoff: '当前稳定damage/Oki vs 追求一次提高未来收益的Medal interaction；Medal不是当前回合唯一目标。'
    successful_round:
    - 'ground contact / anti-air'
    - 'H Rond-point或Renversé拿稳定结果'
    - 'dash Oki先用strike/throw/shimmy读人'
    - '有respect/read时拿一次Medal'
    - '观察对手是否因高Medal更爱jump/mash'
    - '用strike/anti-air惩罚逃grab'
    - '再次利用respect拿更高价值throw'
    common_misplays:
    - '开局为了Medal牺牲所有position/Oki。'
    - 'Medal高以后反而更机械command grab。'
    - '普通throw后把dash当guaranteed throw。'
    - '把不同Medal Level伤害写成固定数字。'
    - '把2MK当2MK DRC。'
    unique_decision: 'Manon新增的是reward-escalation feedback：成功interaction提高未来throw收益，而更高收益改变对手逃抓行为；你要利用行为变化，不只追数字。'
    transfer_in:
    - 'Marisa/Lily/Honda的respect-command-grab框架。'
    - 'grounded spacing / DR / anti-air。'
    - 'strike / throw / shimmy。'
    new_skill:
    - 'Medal Level future-value tracking。'
    - 'Medal对opponent escape behavior的影响。'
    - 'Renversé/Manège Medal scaling。'
    - '高Medal下strike重新定价。'
    unlearn:
    - '角色资源应该优先于position。'
    - 'Medal越高越应该多抓。'
    - 'throw后dash自动等于继续throw。'
    - 'Medal只是伤害lookup表。'
  glossary:
  - {term: 'Medal Level', meaning: '成功Manège Doré / Renversé interaction提高未来投技/route/SA收益；不是S0背诵任务。'}
  - {term: 'Manège Doré', meaning: 'Medal-scaled command grab。H版5F，Lv1到Lv5伤害显著上升。'}
  - {term: 'Rond-point', meaning: '常用稳定ender/anti-air route工具；H版后接forward-dash Oki。'}
  - {term: 'Renversé', meaning: 'projectile-invulnerable route/Medal-growth工具，伤害按Medal Level变化。'}
  - {term: 'Révérence', meaning: '8F / Hit +3 / Block +1 / C 的unique normal，普通pressure工具。'}
  tools:
  - {input: '5MP', name: '站中拳', use: '7F / Hit +2 / Block -2 / C；DR route入口。'}
  - {input: '2MP', name: '蹲中拳', use: '7F / Hit +6 / Block -1 / C；高价值ground confirm。'}
  - {input: '2MK', name: '蹲中脚', use: '8F / Hit +4 / Block -2 / non-cancel；不能套2MK DRC。'}
  - {input: 'H Rond-point', name: '重Rond-point', use: '14F / Block -11；S0稳定ender，后续dash Oki。'}
