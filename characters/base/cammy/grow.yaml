schema_version: '1.1'
character: cammy
evidence_states: [UNLEARNED, LAB_STABLE, MATCH_SEEN, MATCH_STABLE]

# Learner-facing progression owner. Lv0-Lv4 remains the underlying content unlock contract.
progression_policy:
  principle: 'Whole → Part → Whole；先让一套 Cammy 整轮能在真人里跑起来，再由真实断点决定下一项训练。'
  score_rule: 'MR/段位是 Reality evidence，不替代操作、判断与适应证据。'
  current_ui: '前台一次只突出一个当前学习阶段；机会入口 Hub 仍负责具体 Hit / Block / Whiff 与下一步。'

progression_stages:
  - id: S0_MINIMUM_PLAYABLE
    label: '最小可玩'
    learner_goal: '先跑通地面接触→M Spiral Arrow→前冲固定打击→回中距离这一整轮，不靠 Cannon Strike / Hooligan 才能正常打。'
    add_now:
      - '2MK / 5HP / 轻攻击负责地面接触；正常跳优先 Cannon Spike / 2HP。'
      - '两条基础确认先稳定：2LK→2LP→5LK→M Spiral Arrow；2LP→2LP→5LK→M Spiral Arrow。'
      - 'M Spiral Arrow 后前冲先只保留一个稳定打击答案；对手脱出后回 N02。'
    gate:
      lab: '两条基础确认、主对空与 M Arrow→前冲固定打击能稳定执行。'
      match: '真人能出现完整 Loop；断掉时能指出是接触、确认、击倒、前冲还是下一 Turn。'
    defer: ['2MK DRC 主分支', '完整打/投/shimmy树', 'Cannon Strike 主线', 'Hooligan', '角落/SA高资源优化']
    hub_focus: [light, 5hp, antiair]

  - id: S1_FUNDAMENTALS
    label: '基本功成型'
    learner_goal: '把高频免费价值变成比赛里的稳定答案：对空、确认、Arrow Oki、大确反、DI 与被防停手不再反复漏。'
    add_now:
      - 'M Spiral Arrow→前冲固定打击稳定后，再逐个加入普通投与后走 shimmy。'
      - '5HP / 轻攻击被防时允许停手，不播放命中路线。'
      - '挡住明显大无敌技会走够得到的稳定 PC punish。'
      - 'DI / 墙撞先认真实状态，再拿稳定结果。'
    gate:
      match: '主要损失不再反复来自漏对空、漏确认、漏大确反、DI不处理或基础 Oki 做不出来。'
    defer: ['Cannon Strike 作为主要接近', 'Hooligan mix', '高资源多次 DRC', '窄条件 setplay']
    hub_focus: [light, 5hp, antiair, punish, di]

  - id: S2_MASTER_CLIMB
    label: '实战结构化 · 冲 Master'
    learner_goal: '从固定脚本升级到常见分流：Hit / Block / Whiff、对手 mash/tech/jump/reversal、位置和 Drive 开始改变下一步。'
    add_now:
      - '2MK DRC 加入原 Loop；Hit / Block / Whiff 正确分流，不看到接触就自动花 3 格。'
      - 'Arrow Oki 里对 mash / tech / jump / reversal 分别调整 meaty / throw / shimmy / block。'
      - 'H Cannon Spike、角落和资源路线按目的加入，不把高伤路线当默认。'
      - '读法失效时主动结束 Turn 回 N02，而不是为了维持压制硬续。'
    gate:
      match: '常见场景能解释为什么继续、为什么停、为什么花资源；同一种反制重复出现时会调整。'
    defer: ['Cannon Strike 高频主线', 'Hooligan 多分支', '高资源 SA/斩杀树', '角色专属窄 setplay']
    hub_focus: [2mk, light, punish, di, antiair]

  - id: S3_MR1500_STABLE
    label: '选择成熟 · 1500 MR稳定'
    learner_goal: '同一次接触会按对手、位置、Drive和血量选择稳定、运版、Oki、伤害或停手；Cannon Strike 只在高度/距离真的支持时进入。'
    add_now:
      - 'Cannon Strike 作为 conditioned 接触加入已有 Loop；高位/坏间距被防时会停。'
      - '稳定 / 运版 / Oki / 伤害 / 斩杀按场面分流，不为已经花资源而强行打满。'
      - '角落 strike/throw/shimmy 与防凹形成选择树；对手变化后会降频失效选项。'
      - '回放开始回答“为什么这次选它”，而不是只看连段是否完成。'
    gate:
      behavior: '五个能力域多数 MATCH_STABLE；Cannon Strike / 资源选择不破坏基础确认与对空。'
      reality: '1500 MR 只看跨多个时段的持续表现；单次达到或短期掉分不单独定义能力。'
    defer: ['低频 Hooligan 花式', '极限 spacing', '只为最大数字增加的高风险路线']
    hub_focus: [2mk, signature, punish, di, antiair]

  - id: S4_HIGH_MR
    label: '高分上探'
    learner_goal: '优化已经赢到的机会：角落、Hooligan、SA/斩杀、特定 setplay 与 spacing 条件进入，但不让基础 Loop 退化。'
    add_now:
      - 'Hooligan、角落 Cannon Spike、SA/高资源路线与角色特定 setplay 按真实高频问题加入。'
      - 'Cannon Strike 的高度/距离、角落与 active-frame 条件继续显式 conditioned。'
      - '回放问题从漏基础答案转向：同一个正确机会有没有更优兑现、旧节奏是否已被适应。'
    gate:
      behavior: '新增优化建立在稳定地面接触、反空、确认、Arrow Oki 与资源判断之上。'
      reality: '具体高分目标不硬编码；由 Kian 之后明确目标，再用持续表现作为 Reality evidence。'
    hub_focus: [signature, punish, di, 2mk, light]

domains:
  execution:
    label: 操作
    capabilities:
    - {id: EX01, stage: S0, label: '核心无/低资源确认稳定', node: R01, upgrade_evidence: '训练场双侧稳定；实战命中后不掉路线。'}
    - {id: EX02, stage: S2, label: '资源路线不误提交', node: T07, upgrade_evidence: '能在 Hit/Block/Whiff 后正确决定是否花 Drive。'}
    - {id: EX03, stage: S0, label: '反空输入稳定', node: D01, upgrade_evidence: '能在实战把典型跳跃稳定处理，并知道成功后去哪。'}
  neutral:
    label: 立回
    capabilities:
    - {id: NE01, stage: S0, label: '知道远/中/近三段任务', node: N02, upgrade_evidence: '实战能解释当前距离为什么选这个工具。'}
    - {id: NE02, stage: S0, label: '不被招牌机制绑架', node: N01, upgrade_evidence: 'S0 不依赖 Cannon Strike/Hooligan 也能打完整回合。'}
    - {id: NE03, stage: S2, label: '对跳/后退/DI会改地面计划', node: D01, upgrade_evidence: '对手习惯变化后能减少原来的高承诺动作。'}
  contact:
    label: 接触判断
    capabilities:
    - {id: CO01, stage: S1, label: 'Hit / Block / Whiff 三分流', node: T01, upgrade_evidence: '被防不播放命中连段，挥空不自动取消。'}
    - {id: CO02, stage: S2, label: '正帧不是无限续压', node: T02, upgrade_evidence: '每个 +frame 接触只做一次清晰选择并继续观察。'}
    - {id: CO03, stage: S3, label: 'conditioned 数字知道条件', node: T09, upgrade_evidence: '说得出 Cannon Strike 高度/距离、角落/资源条件，不裸背帧数。'}
  offense_loop:
    label: 进攻循环
    capabilities:
    - {id: OF01, stage: S0, label: 'Starter→Route→Ender→Oki闭环', node: O01, upgrade_evidence: '实战完成核心 Loop 后能接下一 Turn。'}
    - {id: OF02, stage: S2, label: '路线按目的选', node: T07, upgrade_evidence: '能在稳定/运版/Oki/伤害之间按场面选择。'}
    - {id: OF03, stage: S3, label: '招牌机制能回核心Loop', node: T03, upgrade_evidence: 'Cannon Strike/Hooligan 失败时会 reset；成功时能回稳定路线/Oki。'}
  defense_adaptation:
    label: 防守与适应
    capabilities:
    - {id: DA01, stage: S2, label: '对手 mash / tech / jump / reversal 有不同答案', node: C01, upgrade_evidence: '至少两局内能依据习惯改变 strike/throw/block 比例。'}
    - {id: DA02, stage: S1, label: '防守成功不死端', node: D02, upgrade_evidence: '挡住大招会 punish；脱离会回 N02。'}
    - {id: DA03, stage: S2, label: '能主动降低失效选项频率', node: C04, upgrade_evidence: '同一读法连续失败后会切换计划。'}

goal_presets:
  FOUNDATION_LOOP: {stage: S0_MINIMUM_PLAYABLE, required: '最小整轮先 LAB_STABLE 并尽快 MATCH_SEEN。'}
  FUNDAMENTALS: {stage: S1_FUNDAMENTALS, required: '高频基本答案多数 MATCH_STABLE，基础漏答不再是主要损失。'}
  MASTER_CLIMB: {stage: S2_MASTER_CLIMB, required: '常见分流与资源/停手已结构化。'}
  MASTER_1500: {stage: S3_MR1500_STABLE, required: '五域多数 MATCH_STABLE；1500 MR 只是持续 Reality milestone。'}
  HIGH_MR: {stage: S4_HIGH_MR, required: '优化围绕真实高分瓶颈，不让基础 Loop 退化。'}
