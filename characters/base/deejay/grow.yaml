schema_version: '1.1'
character: deejay
evidence_states: [UNLEARNED, LAB_STABLE, MATCH_SEEN, MATCH_STABLE]
progression_policy:
  principle: 'Whole → Part → Whole；先把charge/fake区别、5MP +2、Sobat与Jackknife跑成整轮，再逐层加Jus Cool、OD MGU和SA2。'
  score_rule: 'Rank/MR是Reality evidence，不替代charge判断、节奏选择和Oki条件。'
  current_ui: 'Jus Cool不进S0；OD MGU +52后置；SA2固定S4。'
progression_stages:
  - id: S0_MINIMUM_PLAYABLE
    label: '最小可玩'
    learner_goal: '先跑通fake/real Air Slasher区别、5MP +2、light→Quick Sobat、5MP→H Double Sobat +2与Jackknife反空。'
    add_now:
      - '保charge但不被charge绑死。'
      - 'L Air Slasher fake vs M/H real projectile。'
      - '5LP→2LP→Quick Sobat。'
      - '5MP→5LK→H Double Sobat→+2。'
      - 'Jump -> Jackknife anti-air。'
    gate:
      lab: 'fake/real动作、两条基础route、Jackknife反空稳定。'
      match: '真人里能用+2 pressure打整轮，不依赖Jus Cool。'
    defer: ['Jus Cool主线', 'OD MGU +52', '高级safe jump', 'SA2']
    hub_focus: [rhythm, light, medium, antiair]
  - id: S1_FUNDAMENTALS
    label: '基本功成型'
    learner_goal: 'Quick Sobat +34、H Sobat +2、throw +34和H Jackknife grounded +42形成基础Oki。'
    add_now:
      - 'H Sobat +2后strike / throw / shimmy。'
      - 'Quick Sobat +34→DR 5MP/6MK。'
      - 'forward throw +34→DR。'
      - 'H Jackknife grounded +42 safe jump。'
      - 'midscreen H Jackknife two dashes +4。'
    gate:
      match: '主要损失不再来自漏反空、漏confirm、+2 pressure或+42条件错用。'
    defer: ['Jus Cool完整三分支', 'OD MGU +52', 'SA2']
    hub_focus: [oki, throw, medium]
  - id: S2_MASTER_CLIMB
    label: '实战结构化 · 冲 Master'
    learner_goal: 'DR 5MP +6与Jus Cool三分支进入；先用respect，再用节奏变化。'
    add_now:
      - 'DR 5MP block +6。'
      - 'Jus Cool LK low。'
      - 'Jus Cool MK overhead +1。'
      - 'Jus Cool HK starter / block -10。'
      - 'OD Jus Cool selected routes。'
    gate:
      match: '能说出为什么现在用哪个Jus Cool follow-up；不会把整个Jus Cool当一个safe mix。'
    defer: ['OD MGU +52主线', 'SA2', 'corner max chain']
    hub_focus: [drive, jus_cool, punish]
  - id: S3_MR1500_STABLE
    label: '选择成熟 · 1500 MR稳定'
    learner_goal: 'OD MGU +52与更深fake/charge节奏进入；高Oki预算只在真实opening使用。'
    add_now:
      - 'OD MGU +52→two dash +14。'
      - 'fake/real Air Slasher节奏按对手反应调整。'
      - 'selected +37/+43 safe-jump variants。'
      - 'selected OD Jus Cool / OD Double Sobat extension。'
      - 'active-frame setplay在lab闭合后加入。'
    gate:
      behavior: '高回报route不会挤掉基础+2/+6 pressure；fake频率被适应后会调整。'
      reality: '1500 MR只作持续Reality milestone。'
    defer: ['SA2 Sunrise Festival完整系统', 'burnout max']
    hub_focus: [od_mgu, rhythm, jus_cool]
  - id: S4_HIGH_MR
    label: '高分上探'
    learner_goal: 'SA2、corner max、SA3 lethal与burnout routes进入；节奏优化围绕真实对手反应。'
    add_now:
      - 'SA2 Sunrise Festival timing system。'
      - 'corner high-resource chain。'
      - 'SA3 lethal / punish。'
      - 'burnout-specific Air Slasher pressure。'
      - 'matchup-specific fake/projectile cadence。'
    gate:
      behavior: '高级节奏系统不会让基础charge/anti-air/+2 pressure退化。'
      reality: '高分目标由持续表现定义。'
    hub_focus: [super, od_mgu, rhythm]
domains:
  execution:
    label: 操作
    capabilities:
    - {id: EX01, stage: S0, label: 'fake/real Air Slasher区分稳定', node: rhythm, upgrade_evidence: '输入与节奏都不会混。'}
    - {id: EX02, stage: S0, label: 'Jackknife反空稳定', node: antiair, upgrade_evidence: '有down charge时能处理典型跳跃。'}
    - {id: EX03, stage: S2, label: 'Jus Cool三分支稳定', node: jus_cool, upgrade_evidence: '低/overhead/starter输入不混。'}
  neutral:
    label: 立回
    capabilities:
    - {id: NE01, stage: S0, label: 'charge不绑架neutral', node: rhythm, upgrade_evidence: '会穿插non-charge Sobat/normal。'}
    - {id: NE02, stage: S1, label: 'fake频率有理由', node: rhythm, upgrade_evidence: '不为了“难猜”机械fake。'}
    - {id: NE03, stage: S3, label: 'fake/real按对手反应动态调', node: rhythm, upgrade_evidence: '被适应后会换节奏。'}
  contact:
    label: 接触判断
    capabilities:
    - {id: CO01, stage: S0, label: '5MP +2是真实respect点', node: medium, upgrade_evidence: 'strike/throw/shimmy分流。'}
    - {id: CO02, stage: S2, label: 'Jus Cool follow-up按目的选', node: jus_cool, upgrade_evidence: '知道low/overhead/starter风险。'}
    - {id: CO03, stage: S3, label: '+42带grounded-hit条件', node: oki, upgrade_evidence: '不把air hit误记成safe jump。'}
  offense_loop:
    label: 进攻循环
    capabilities:
    - {id: OF01, stage: S0, label: 'Sobat +2/+34闭环', node: medium, upgrade_evidence: 'hit后能接下一Turn。'}
    - {id: OF02, stage: S1, label: 'H Jackknife +42闭环', node: oki, upgrade_evidence: 'safe jump后回strike/throw。'}
    - {id: OF03, stage: S3, label: 'OD MGU +52闭环', node: od_mgu, upgrade_evidence: '+14状态能转成稳定pressure。'}
  defense_adaptation:
    label: 防守与适应
    capabilities:
    - {id: DA01, stage: S0, label: '无charge时不假装有Jackknife', node: antiair, upgrade_evidence: 'charge availability判断正确。'}
    - {id: DA02, stage: S2, label: '对手应对Jus Cool会调分支', node: jus_cool, upgrade_evidence: '不机械循环三选。'}
    - {id: DA03, stage: S4, label: 'Sunrise Festival按真实机会使用', node: super, upgrade_evidence: '不会为了系统复杂度硬开。'}
goal_presets:
  FOUNDATION_LOOP: {stage: S0_MINIMUM_PLAYABLE, required: 'fake/real→+2 pressure→Sobat/Jackknife先LAB_STABLE并尽快MATCH_SEEN。'}
  FUNDAMENTALS: {stage: S1_FUNDAMENTALS, required: 'Sobat Oki、throw、+42 grounded safe jump多数MATCH_STABLE。'}
  MASTER_CLIMB: {stage: S2_MASTER_CLIMB, required: 'DR +6与Jus Cool三分支结构化。'}
  MASTER_1500: {stage: S3_MR1500_STABLE, required: '五域多数MATCH_STABLE；OD MGU/fake节奏不破坏基础。'}
  HIGH_MR: {stage: S4_HIGH_MR, required: 'SA2/高资源节奏围绕真实高分瓶颈。'}
