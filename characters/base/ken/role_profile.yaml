  signature_mechanic:
    name: 'Quick Dash / Jinrai end-state engine'
    rule: '角色特色不是独立资源，而是把普通确认通过 Quick Dash / Jinrai / ender 选择换成更强的 carry、Oki 或角落状态。'
  key_numbers:
  - {label: '2MP', value: '6F / Hit +5 / Block 0', decision: 'Year 4 后普通命中可接 5LK；贴身还能接更高价值路线。'}
  - {label: '2MK', value: '7F / Hit -2 / Block -6 / C', decision: '主要低段 DRC 入口；未取消时被防就结束。'}
  - {label: 'H / Quick-Dash Shoryuken', value: '常见 KD +25 -> dash +6', decision: '第一套稳定 Oki 标尺：打 / 投 / shimmy。'}
  - {label: 'Corner M Shoryuken', value: '常见 +33 -> 2MK whiff -> +5', decision: '角落 frame-kill family；只在对应角落路线使用。'}
  - {label: 'H Dragonlash', value: '28F / Block +1', decision: '结果是正帧，但发生慢；价值取决于距离和对手反应。'}
  - {label: 'Quick Dash Forward Step Kick', value: '8F branch / Hit +1 / Block -4', decision: 'Year 4 后更快，但不是命中后固定大收益。'}
  constraints:
  - 'Quick Dash 是路线/距离状态，不是看到中距离就自动冲。'
  - 'Jinrai 各 follow-up 的 block/hit 结果不同，不能投影成一条万能安全字符串。'
  - 'H Dragonlash +1 必须和 28F startup 一起理解。'
  - '角落 active-frame meaty、空中命中 Quick Dash Tatsu 等必须保留条件。'
