schema_version: '1.0'
character: kimberly
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Kimberly先把普通contact换成角落位置；到了墙边以后，Sprint分支和Shuriken Bomb才把下一轮变复杂。'
    preferred_range: '中近距离。2MP / 5MP / 5MK拿contact，Sprint -> Shadow Slide负责carry；Bomb只在已经赢到角落后放大setplay。'
    win_pattern: 'ground contact -> L Vagabond或Shadow Slide -> corner carry -> strike / throw / shimmy -> Sprint高低/Stop -> Bomb延迟威胁 -> +42 / SA3继续滚雪球。'
    lose_pattern: '第一天就一直Sprint/Arc Step、没到角落就强行Bomb、把2MK +1当DRC入口、角落基础没稳就背3-Bomb和SA3花活。'
  character_model:
    essence_short: 'Kimberly的核心不是“移动多”或“炸弹多”，而是先把普通opening送进角落，再用Sprint和Bomb把位置优势变成setplay。'
    essence_detail: 'Kimberly最容易被学成“跑得快、花活多、炸弹多”的角色，但当前Training Order反而把她拆得很清楚：先用light到L Vagabond Edge、2MP/medium到Sprint -> Shadow Slide，把普通contact稳定地换成corner carry；再学Shadow Slide后的strike / throw / shimmy；之后才加入5MK DRC与Sprint的overhead / low / Emergency Stop分支。真正属于Kimberly的高层特色发生在角落：Shadow Slide把人送到墙边后，Shuriken Bomb库存开始把一个普通击倒变成有延迟威胁的setplay，Year 4又把Bomb最大库存提升到3。她因此不是“移动越多越强”，而是先把移动用作位置转换，再用角落Bomb和Sprint读法让对手的防守选择越来越难。SA3的持续伤害/走速buff最后才进入，因为它改变的是已经稳定的角色循环，而不是入门前提。'
    force_opponent_to:
    - '先尊重2MP / 5MP的普通近身confirm与5HK block +2。'
    - '被Sprint -> Shadow Slide不断推向角落时提前处理位置。'
    - '角落后同时处理Bomb延迟威胁、strike / throw / shimmy与Sprint高低。'
    - '高阶段还要处理+42 safe jump与SA3强化后的持续压力。'
    payoff_after_respect:
    - 'Shadow Slide把普通confirm直接换成corner access。'
    - '角落throw / strike / shimmy更容易成立。'
    - 'Bomb把防守时间线变成“现在防本体，稍后还要处理爆炸”。'
    - '+42 safe jump与SA3 buff进一步放大已经拿到的角落状态。'
    core_tradeoff: '稳定carry/simple Oki vs 更复杂Sprint/Bomb setplay。Bomb stock有限，要比较现在花一颗扩大角落回合，还是留给下一次更确定的setup。'
    successful_round:
    - 'light / 2MP / 5MK拿普通contact'
    - 'Sprint -> Shadow Slide把人送向角落'
    - 'dash后strike / throw / shimmy'
    - '角落基础稳定后加入Sprint overhead / low / Stop'
    - 'Bomb进入后延长角落选择树'
    - '高阶段用+42 safe jump和SA3 buff继续滚雪球'
    common_misplays:
    - '一开始就一直Sprint/Arc Step，ground confirm反而不稳。'
    - '没到角落就强行围着Bomb打，浪费资源和注意力。'
    - '把2MK block +1误当成可取消DRC入口。'
    - 'SA3一有就机械开，不看当前round价值与资源。'
    unique_decision: '相对Rashid，Kimberly的移动重点不是改变re-entry角度，而是把opening换成corner；到了角落，再用Bomb和Sprint把位置优势变成setplay。'
    transfer_in:
    - 'grounded contact / strike / throw / shimmy。'
    - 'anti-air / punish / DI / corner Oki。'
    - '移动必须建立在已确认contact之上的纪律。'
    new_skill:
    - 'Sprint follow-up职责分工。'
    - 'route价值按corner arrival衡量。'
    - 'Shuriken Bomb有限stock与延迟setplay。'
    - '+42 safe jump和Bomb/Oki叠层。'
    - 'SA3持续buff后的round-long调整。'
    unlearn:
    - 'mobility等于neutral里一直跑。'
    - '2MK block +1就应该DRC。'
    - '有Bomb就应该马上用。'
    - 'setplay选项越多越应该S0全学。'
  glossary:
  - {term: '236K｜Sprint', meaning: 'Kimberly的主要移动hub。只有在已经有contact/spacing理由时才进入；可接Stop、Shadow Slide、Neck Hunter、Arc Step等。'}
  - {term: '236P｜Vagabond Edge', meaning: '稳定route工具。L版是S0 light ender并留下+3。'}
  - {term: 'Sprint > Shadow Slide', meaning: '核心carry低段收尾。当前主要价值是把普通contact送向角落和+47一类Oki。'}
  - {term: 'Shuriken Bomb stock', meaning: '角落setplay资源。Year 4最大库存3；S0不要求使用。'}
  - {term: 'SA3｜Bushin Ninjastar Cypher', meaning: '后期持续buff：伤害倍率约111%并提高走速；不是入门身份。'}
  tools:
  - {input: '2MP', name: '蹲中拳', use: '6F / Hit +7 / Block -1 / C；最重要的ground confirm之一。'}
  - {input: '5MK', name: '站中脚', use: '8F可取消；当前主要CDR starter。'}
  - {input: '2MK', name: '蹲中脚', use: '7F / Hit +5 / Block +1 / non-cancel；是正帧低段，但不是DRC入口。'}
  - {input: '236LP', name: 'L Vagabond Edge', use: 'S0 light ender；命中后+3，简单继续2LP / throw / shimmy。'}
  - {input: '236K > Shadow Slide', name: 'Sprint -> Shadow Slide', use: '核心carry/Oki路线；+47 family并把对手送向角落。'}
  - {input: '236K > Emergency Stop / Neck Hunter', name: 'Sprint options', use: 'S1以后加入Stop throw/shimmy与overhead分支。'}
  - {input: 'Shuriken Bomb', name: '喷漆炸弹资源', use: 'S2以后角落setplay；库存有限，Year4上限3。'}
