schema_version: '1.0'
character: zangief
status: SOURCE_CLOSURE_DRAFT
role_profile:
  identity:
    one_line: '老桑先用走路和大拳脚让对手不敢乱动；对手愿意站着防以后，360P 高伤指令投才真正成立。'
    preferred_range: '中近距离慢慢压空间。6HP、3MP、5HP/5HK 等建立尊重；进入近身后打击与 360P 互相放大。'
    win_pattern: '走路压空间 -> 打击/反空让对手老实 -> 正帧或近身 -> strike / 360P 二择 -> 看击倒距离决定保证起攻还是重新追近 -> 对手因怕投开始跳/抢按 -> 再用拳脚抓。'
    lose_pattern: '没建立尊重就裸 360P、只看抓投伤害不看位置、把所有大 KD 数字当固定贴脸 Oki、不会走路只靠跳/DR/特殊技接近。'
  character_model:
    essence_short: '先用拳脚让对手觉得“站着防最安全”，再用 360P 指令投惩罚这份尊重；对手怕投后，拳脚又更容易抓到他的跳、退和抢按。'
    essence_detail: '桑吉尔夫不是“近身就猜 SPD”的角色。稳定的老桑先靠走路、站位和大按钮一点点压缩对手的动作，让乱按、乱跳、乱后退都要付代价。6HP 被防后你先恢复，3MP 能稳定接收尾，反空和 Lariat 让对手不能随便跳；这些打击不是为了凑长 Combo，而是在制造一种心理状态：对手开始相信“老实防比较安全”。这时 360P 高伤指令投才真正变成核心威胁。对手因为怕抓开始提前跳、后退或抢按，你又回到打击、反空和延迟按钮去抓这些反应。另一个必须学会的区别是：抓投或 Lariat 后的数字很大，不代表一定贴脸继续猜。很多情况下距离被拉开，下一步只是 Drive Rush 或走路重新接近再读人。老桑真正经营的是尊重、恐惧和空间，而不是 Combo 数量。'
    force_opponent_to:
    - '不敢随便抢按或乱跳。'
    - '愿意站着防，接受你靠近和正帧接触。'
    payoff_after_respect:
    - '360P 高伤指令投变成真实威胁。'
    - '对手怕投后开始跳/退/抢按，让你的拳脚更容易命中。'
    - '正帧接触后形成 strike / command grab / block 的高价值猜拳。'
    core_tradeoff: '眼前抓投伤害 vs 击倒后的距离/下一次接近成本；以及 strike 建立尊重 vs 360P 吃掉尊重。'
    successful_round:
    - '走路压空间'
    - '拳脚/反空让对手不敢乱动'
    - '进入正帧或近身'
    - '打击 / 360P 二择'
    - '判断保证起攻还是重新追近'
    - '抓对手为躲投产生的新反应'
    common_misplays:
    - '一近身就裸 360P，没有先做出尊重。'
    - '觉得高伤抓投永远比 strike route 更值。'
    - '把 +28/+30/+38 等数字直接理解成保证贴脸。'
    - '不会走路压空间，只靠跳和冲刺接近。'
    unique_decision: '标准 strike/throw 角色也会猜投，但老桑的 command grab 回报高到足以重塑对手的整个防守；你要主动经营“对手愿不愿意站着防”，并把击倒后的距离成本算进每次选择。'
    transfer_in:
    - '走位/距离、反空、确反、DI 反应。'
    - '普通 strike/throw/shimmy 基础。'
    new_skill:
    - 'command-grab respect loop。'
    - '保证 Oki 与重新追近读人的区分。'
    - '把位置成本和下一次接近成本加入路线价值。'
    unlearn:
    - '近身就应该立刻 360P。'
    - 'KD 数字越大就越等于贴脸压制。'
    - 'Combo 少等于角色简单。'
  glossary:
  - {term: '360P｜高伤指令投（SPD / Screw Piledriver）', meaning: '对站着防守的对手有效；真正的价值来自你先用拳脚让对手愿意防。'}
  - {term: 'PP｜双臂旋转攻击（Double Lariat）', meaning: '常见反空/确认/收尾工具；命中高度不同会改变击倒后的距离和帧差。'}
  - {term: '正帧 / 你先恢复', meaning: '被防或命中后你比对手更早恢复，因此更有资格先出下一招。'}
  - {term: '重新追近再读人', meaning: '不是保证贴脸 Oki；先靠 DR/走路接近，再判断对手下一步。'}
  tools:
  - {input: '6HP', name: '头槌 | Headbutt', use: '14F；Hit +8 / Block +4，是建立尊重和进入 strike/360P 的核心正帧接触。'}
  - {input: '3MP', name: 'Hellstab', use: '7F 可取消；常见稳定确认/连段桥接。'}
  - {input: 'PP', name: '双臂旋转攻击 | Double Lariat', use: '15F；反空/收尾核心，但不同命中状态会给不同 KD，不能记一个万能 Oki。'}
  - {input: 'PPP', name: 'OD 双臂旋转攻击', use: '12F；花 Drive 换更强击倒/起攻，+38 是重要状态桶之一。'}
  - {input: '360P', name: '高伤指令投 | SPD', use: '5F；只有对手已经愿意站着防时才真正可怕。不同强度影响伤害/距离。'}
  - {input: '5HK', name: '站重脚', use: 'Block +1；高承诺正帧工具，用来继续建立尊重。'}
