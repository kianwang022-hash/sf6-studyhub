    name: 'Temporary Serenity Stream routing -> charge bypass -> continue-or-exit decision'
    rule: '普通confirm先拿稳定Oki；earned contact后stance把normal重新路由到charge special，随后再按对手与回合价值决定继续高低分支或Up退出。'
  key_numbers:
