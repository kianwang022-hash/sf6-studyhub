schema_version: '1.0'
character: chunli
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Chun-Li先用5MP +1、Kikoken和稳定SBK击倒守住地面；接触后再用Serenity Stream把charge管理变成路线选择，而不是一开始就背整棵stance树。'
    preferred_range: '中距离用快速步行、5MP/2MK和Kikoken控制地面；命中先拿SBK稳定击倒，已赚到contact后才进入Serenity Stream。'
    win_pattern: 'ground control -> stable SBK knockdown -> dash +14/+15 strike/throw/shimmy -> respect -> earned Serenity Stream -> stable Forward Strike→SBK or later high/low/exit -> corner exact-state setplay。'
    lose_pattern: '第一阶段就背完整stance树、把stance当neutral常驻、混淆Lotus Fist +1与3HP -3、以为所有SBK都不需要charge、把+45/+46泛化。'
  character_model:
    essence_short: '先用5MP +1与稳定SBK拿住回合；接触后用Serenity Stream重组charge路线，再逐步加入高低与退出。'
    essence_detail: 'Chun-Li不是“招式很多所以很复杂”。没有开口时，她先靠快速步行、5MP被防+1、2MK和Kikoken让对手留在地面；命中后，5MP > 2MP > M Spinning Bird Kick已经能给出+34击倒，dash后+15，足够跑strike / throw / shimmy。Serenity Stream真正独特的价值，是把已经确认的Normal接触切进一个临时路由层：例如2HP进入stance，再用Forward Strike接M Spinning Bird Kick，让这条路线不要求你事前一直保留普通SBK所需的蓄力。Year4又允许用Up退出，并让stance Lotus Fist被防+1，所以stance既是combo routing工具，也能在基础pressure已经建立后提供overhead、low、plus pressure或安全退出。真正要学的是“这一拍值得继续深入，还是走最稳路线/直接退出”，而不是一次背完所有分支。'
    force_opponent_to:
    - '尊重5MP Block +1，不把每次近身都当自己的回合。'
    - '在Kikoken后处理步行、低段、throw与反跳。'
    - 'M SBK +34后处理dash +15的strike / throw / shimmy。'
    - 'Serenity Stream入口已经被赚到时，不能只押站防或蹲防一种答案。'
    create_respect_with:
    - '5MP Block +1 -> 5LP。'
    - '5MP > 2MP > M Spinning Bird Kick。'
    - '2LK > 2LP > L Spinning Bird Kick。'
    - 'L Kikoken后的步行pressure。'
    - 'H Tensho Kicks anti-air。'
    payoff_after_respect:
    - 'Serenity Stream Forward Strike可以把confirmed contact接回M SBK，形成charge-bypass route。'
    - 'stance Lotus Fist当前Block +1，可以在S2后承担overhead pressure。'
    - '低段 / plus strike / exit共同让stance不能被一个防守答案简化。'
    - '角落+45/+46 exact states后置成safe-jump放大器。'
    core_tradeoff: '最稳的普通confirm / charged ender vs 把已赚到的contact投入Serenity Stream，换charge-bypass与更多分支，同时增加判断和条件负担。'
    successful_round:
    - '5MP / 2MK / Kikoken控制地面'
    - '命中先用SBK稳定收尾'
    - 'dash +14/+15跑strike / throw / shimmy'
    - 'respect形成后从明确contact进入Serenity Stream'
    - '需要稳定时Forward Strike→M SBK；防守固定后再加入Lotus/low/exit'
    - '进角后才使用+45/+46 exact-state setplay'
    common_misplays:
    - 'S0就背完整stance树，基础confirm与Oki反而不稳。'
    - '把stance当neutral常驻模式。'
    - '把stance Lotus Fist +1和3HP Water Lotus Fist -3混在一起。'
    - '以为所有SBK路线都不需要charge。'
    - '没确认就提交SBK，被防后承担-17/-18级风险。'
    - '把H Tensho grounded/airborne和+45/+46状态混成一个数字。'
    unique_decision: 'Chun-Li新增的是temporary stance routing：已确认的normal contact可进入Serenity Stream，再选择charge-bypass稳定路线、后续高低分支或直接退出。'
    transfer_in:
    - 'projectile / anti-air / grounded spacing。'
    - 'strike / throw / shimmy与2MK CDR。'
    - '角色机制不能牺牲当前回合稳定性的原则。'
    new_skill:
    - 'Serenity Stream作为temporary routing layer。'
    - 'stance follow-up连接charge special。'
    - 'stance continue vs Up exit。'
    - 'grounded / airborne / corner exact-state Oki区分。'
    - '后置的+45/+46 safe-jump state accounting。'
    unlearn:
    - '复杂角色应该先学所有招式。'
    - 'stance是neutral默认模式。'
    - '所有SBK都不需要charge。'
    - '所有Lotus Fist都共享+1。'
    - 'safe-jump数字可以套所有击倒。'
  glossary:
  - {term: '214P｜Serenity Stream', meaning: '临时stance / routing layer；当前Year4可用Up退出。S0只学一条Forward Strike→M SBK路线。'}
  - {term: '2↓8K｜Spinning Bird Kick', meaning: '蓄力combo ender；L/M/H被防都很危险，只在确认后提交。'}
  - {term: 'stance LK｜Forward Strike', meaning: 'Serenity Stream低段follow-up；S0用来接M SBK，证明stance对charge route的连接。'}
  - {term: 'stance HP｜Lotus Fist', meaning: 'Serenity Stream follow-up；当前Block +1。不要和3HP Water Lotus Fist -3混淆。'}
  - {term: '22K｜Tensho Kicks', meaning: 'anti-air / reversal / route工具；grounded与airborne hit的Oki必须分开。'}
  tools:
  - {input: '5MP', name: '站中拳', use: '5F / Hit +6 / Block +1 / C；最重要的普通contact与pressure owner。'}
  - {input: '2MK', name: '蹲中脚', use: '7F / Hit -2 / Block -6 / C；S1加入CDR。'}
  - {input: '4HP', name: 'Hakkei', use: '8F / Hit +5 / Block -1 / C；DR/stance route桥。'}
  - {input: '214P', name: 'Serenity Stream', use: 'temporary route/pressure layer；S0只证明route value并学Up退出。'}
  - {input: '2↓8K', name: 'Spinning Bird Kick', use: 'confirmed charged ender；M常见+34，dash后+15。'}
  - {input: '22K', name: 'Tensho Kicks', use: 'anti-air；H grounded +37与corner airborne +35要分开。'}
