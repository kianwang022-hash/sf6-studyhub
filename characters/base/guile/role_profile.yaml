  signature_mechanic:
    name: 'Charge availability management'
    rule: '在兼容防守/normal里后台存charge；每次移动和按键都同时判断是否还保留Boom/Somersault资格。'
  key_numbers:
  - {label: 'Sonic Boom', value: '10F / normal Block -3', decision: '横向塑形；发完继续看跳。'}
  - {label: 'OD Sonic Boom', value: 'Block +3', decision: '资源换更强projectile pressure。'}
  - {label: 'H Somersault', value: '7F / common KD约+37；特定+39~41', decision: '核心ender；Oki受hit height影响。'}
