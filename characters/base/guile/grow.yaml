schema_version: '1.1'
character: guile
evidence_states: [UNLEARNED, LAB_STABLE, MATCH_SEEN, MATCH_STABLE]
progression_policy:
  principle: 'Whole → Part → Whole；先让charge availability→Boom/Flash Kick→stable confirm成立，再加入角落、DR、Blade和Super层。'
  score_rule: 'Rank/MR是Reality evidence，不替代charge保存、反空、spacing与Oki条件判断。'
  current_ui: 'S0不要求Sonic Blade；+42和Solid Puncher固定后置。'
progression_stages:
  - id: S0_MINIMUM_PLAYABLE
    label: '最小可玩'
    learner_goal: '先学会边防守/normal边存charge，跑通Boom→看跳→Somersault，以及两条基础confirm。'
    add_now:
      - 'down-back期间做crouch-block / 2LP / 2MP，理解charge是后台状态。'
      - 'normal Sonic Boom塑造横向空间，发完继续看跳。'
      - '2LK→2LP→H Somersault。'
      - '5MP→2MP→H Somersault。'
      - '典型跳跃优先Somersault；没有charge时回普通防守/对空。'
    gate:
      lab: 'Boom、anti-air Somersault、两条confirm稳定；不会因为保charge而完全不动。'
      match: '真人里能出现Boom→anti-air/ground contact→Somersault，而不是蹲着等。'
    defer: ['Sonic Blade/Cross主线', 'corner +4完整树', 'DR压力', '+42 safe jump', 'Solid Puncher']
    hub_focus: [charge, boom, light, medium, antiair]
  - id: S1_FUNDAMENTALS
    label: '基本功成型'
    learner_goal: '角落+4、back-normal charge route与基础throw/strike/shimmy补齐；学会主动放弃charge换位置。'
    add_now:
      - '5MP→4HP→H Somersault。'
      - 'corner H Somersault→3HK whiff→+4。'
      - '6HP block +3。'
      - 'forward throw +15基础下一轮。'
      - '需要走位/前冲时，明确接受“现在会丢charge”。'
    gate:
      match: '主要损失不再来自漏反空、漏confirm、角落+4或为了charge僵死不动。'
    defer: ['OD Blade +1', '复杂Blade/Cross', '+42', 'SA2']
    hub_focus: [medium, corner, charge]
  - id: S2_MASTER_CLIMB
    label: '实战结构化 · 冲 Master'
    learner_goal: 'DR与Year4 OD Blade +1进入；高优势接触里仍能重新建立charge。'
    add_now:
      - '4HP CDR→5MP block +4。'
      - 'DR 5MP stable route。'
      - 'DR overhead route。'
      - 'OD Sonic Blade block +1。'
      - 'corner Blade route与forward-throw DR选项。'
    gate:
      match: 'DR/pressure之后会重新判断charge，而不是高优势一结束就失去Boom/Flash Kick结构。'
    defer: ['+42 safe jump', 'Perfect Boom', 'Solid Puncher']
    hub_focus: [drive, blade, corner]
  - id: S3_MR1500_STABLE
    label: '选择成熟 · 1500 MR稳定'
    learner_goal: 'Blade/Cross空间层、hit-height +42与Perfect Boom开始进入，但只在有独立价值时使用。'
    add_now:
      - 'H Somersault→L/H Sonic Blade的spacing层。'
      - 'Sonic Cross与anti-air/read形成二层空间。'
      - '特定hit-height +42→safe jump。'
      - 'Perfect Sonic Boom作为节奏/伤害优化。'
      - '按matchup决定何时放弃charge换走位。'
    gate:
      behavior: '能说出当前为什么保charge或放charge；+42不会条件错用。'
      reality: '1500 MR只作持续Reality milestone。'
    defer: ['Solid Puncher完整系统', 'Perfect Somersault高阶优化']
    hub_focus: [blade, safe_jump, charge]
  - id: S4_HIGH_MR
    label: '高分上探'
    learner_goal: 'Solid Puncher、SA1 +70、SA3 lethal、Perfect执行与matchup Boom cadence进入。'
    add_now:
      - 'SA2 Solid Puncher作为projectile system。'
      - 'HP-version SA1 +70 setplay。'
      - 'SA3高资源punish/lethal。'
      - 'Perfect Boom/Somersault执行优化。'
      - 'matchup-specific charge sacrifice / Boom cadence。'
    gate:
      behavior: 'Super/Perfect优化不让基础charge、anti-air和corner循环退化。'
      reality: '高分目标由持续表现定义。'
    hub_focus: [super, blade, safe_jump]
domains:
  execution:
    label: 操作
    capabilities:
    - {id: EX01, stage: S0, label: '边crouch动作边保charge', node: charge, upgrade_evidence: '2LP/2MP后仍能合法Flash Kick。'}
    - {id: EX02, stage: S0, label: '两条Somersault confirm稳定', node: light, upgrade_evidence: 'light与5MP starter都稳定。'}
    - {id: EX03, stage: S3, label: '+42 safe jump条件稳定', node: safe_jump, upgrade_evidence: '只在正确hit height执行。'}
  neutral:
    label: 立回
    capabilities:
    - {id: NE01, stage: S0, label: 'Boom后继续看跳', node: boom, upgrade_evidence: 'projectile不会锁死注意力。'}
    - {id: NE02, stage: S1, label: '能主动放弃charge换位置', node: charge, upgrade_evidence: '不会为保charge僵死。'}
    - {id: NE03, stage: S3, label: 'Blade/Cross和Boom分工清楚', node: blade, upgrade_evidence: '空间层按局面使用。'}
  contact:
    label: 接触判断
    capabilities:
    - {id: CO01, stage: S0, label: '5MP block 0会重读', node: medium, upgrade_evidence: '不会把0F当固定回合。'}
    - {id: CO02, stage: S2, label: 'DR接触后重建charge', node: drive, upgrade_evidence: '高优势pressure结束后仍有special结构。'}
    - {id: CO03, stage: S3, label: 'Somersault Oki带hit-height条件', node: safe_jump, upgrade_evidence: '不再说所有H Flash Kick都+42。'}
  offense_loop:
    label: 进攻循环
    capabilities:
    - {id: OF01, stage: S0, label: 'Boom/anti-air→Somersault闭环', node: boom, upgrade_evidence: '空间控制能转成真实击倒。'}
    - {id: OF02, stage: S1, label: 'corner +4闭环', node: corner, upgrade_evidence: 'throw/strike/shimmy能反复运行。'}
    - {id: OF03, stage: S3, label: 'Blade/+42回核心Loop', node: blade, upgrade_evidence: '高级setplay结束后仍回charge/spacing。'}
  defense_adaptation:
    label: 防守与适应
    capabilities:
    - {id: DA01, stage: S0, label: '没有down charge时不假装有Flash Kick', node: charge, upgrade_evidence: 'charge availability判断正确。'}
    - {id: DA02, stage: S2, label: '对手跳/Parry/走位改变Boom频率', node: boom, upgrade_evidence: 'projectile cadence会调整。'}
    - {id: DA03, stage: S4, label: 'Solid Puncher按局面使用', node: super, upgrade_evidence: '不会机械install。'}
goal_presets:
  FOUNDATION_LOOP: {stage: S0_MINIMUM_PLAYABLE, required: 'charge→Boom/Flash Kick→confirm先LAB_STABLE并尽快MATCH_SEEN。'}
  FUNDAMENTALS: {stage: S1_FUNDAMENTALS, required: '反空、confirm、corner+4和charge-release判断多数MATCH_STABLE。'}
  MASTER_CLIMB: {stage: S2_MASTER_CLIMB, required: 'DR/OD Blade与charge重建结构化。'}
  MASTER_1500: {stage: S3_MR1500_STABLE, required: '五域多数MATCH_STABLE；Blade/+42不破坏基础。'}
  HIGH_MR: {stage: S4_HIGH_MR, required: 'Solid Puncher/Perfect/SA优化围绕真实瓶颈。'}
