- id: oki
  title: 'Throw / +42｜直接进入 Next Loop 的特殊入口'
  stage: S1
  subtitle: '价值在固定起攻，不在最长连段'
  rows:
  - result: CORNER_THROW
    stage: S1
    choice: '+17'
    input: 'Forward Throw -> whiff 5LP'
    value: {damage: 1200, kd: '+17'}
    next_loop: '再投 / 打 / Shimmy / 停手防'
    why: '用 whiff 5LP 把角落投命中变成固定下一轮。'
    verification: verified
    sources: [SRC03]
  - result: PLUS42
    stage: S4
    choice: Safe Jump
    input: '236LK grounded hit / 236HK airborne hit -> forward jump j.HK'
    value: {kd: '+42', oki: safe_jump}
    next_loop: 'j.HK / 空跳投 / 空跳2LK / 落地防'
    why: '+42 的意义就是把击倒兑换成 Safe Jump。'
    verification: conditioned
    conditions: [236LK_grounded_hit_or_236HK_airborne_hit]
    sources: [SRC03]
