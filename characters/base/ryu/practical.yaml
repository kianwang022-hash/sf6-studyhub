schema_version: '1.0'
character: ryu
version_scope:
  game_version: 'Year 4 / 2026-08-03'
  checked_through: '2026-09-16'
  primary_source: SRC03
policy:
  primary_results: [WHIFF, BLOCK, HIT]
  input_first: true
  future_stages_collapsed: true
  ids_hidden_in_learner_ui: true
  default_table_columns: [result_choice, full_input, value_resource, next_loop_why]
  damage_note: 'damage values are current-source/calculation assets; rows marked training_mode must be rechecked before exact canonical freeze'
stages:
  S0:
    label: 最小可玩
    short: '3 条核心 + +37 Loop'
  S1:
    label: 基本功成型
    short: 'Oki / PC / Carry'
  S2:
    label: 实战结构化
    short: '2MK DRC / DI'
  S3:
    label: 选择成熟
    short: '位置 / Denjin / 资源'
  S4:
    label: 高分上探
    short: 'Kill / Safe Jump / 条件优化'
shared_packages:
  HPDP_PLUS37:
    label: '+37 主循环'
    sequence: '623HP -> KD +37 -> 66 -> about +18 -> 6HP meaty'
    next: 'strike / throw / shimmy / block reversal'
    verification: verified
    sources: [SRC01, SRC03]
  OD_HBK_CARRY:
    label: 'OD236K 运版 Oki'
    sequence: 'OD236K -> dl.6HK -> j.214K -> 66 -> 66'
    next: 'strike / throw / shimmy'
    verification: conditioned
    conditions: [starter_and_height_affect_landing]
    sources: [SRC03]
opportunities:
- id: 5mp
  title: '5MP｜近身确认主干'
  stage: S0
  subtitle: 'Hit +7 / Block -1；命中才提交'
  guide:
    short: '先固定 Hit / Block / Whiff。S0 只练稳定确认；S1 才加运版；S4 才讨论 4HP 紧连接。'
    play_target: T01
  rows:
  - result: WHIFF
    stage: S0
    choice: 停止
    input: '停止剩余输入'
    value: {drive: 0}
    next_loop: 'Neutral'
    why: '挥空后继续播串只会增加被差合时间。'
  - result: BLOCK
    stage: S0
    choice: 默认
    input: '停手 -> 重读'
    value: {frame: -1, turn: 不保证回合}
    next_loop: 'Neutral / 重新观察'
    why: '不要把 Block 当成 Hit 树继续走。'
  - result: HIT
    stage: S0
    choice: 默认稳定
    input: '5MP > 2MP xx 623HP'
    value: {damage: 2320, drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '0 Drive、低认知负担，并直接回 +37 主循环。'
    verification: verified
    sources: [SRC01, SRC03]
  - result: HIT
    stage: S1
    choice: 'Carry + Oki'
    input: '5MP > 2MP > OD236K > dl.6HK > j.214K'
    value: {damage: 2940, drive: 2, carry: high}
    next_loop_package: OD_HBK_CARRY
    why: '多花 2 Drive，换明显运版与近身 Oki。'
    verification: conditioned
    sources: [SRC03]
  - result: HIT
    stage: S4
    choice: 优化候选
    input: '5MP > 4HP xx 623HP'
    value: {damage: 2520, drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '同资源多 200 伤害，但 7F 紧连接与距离稳定性仍需判断是否值得替换 S0。'
    verification: provisional
    verify: training_mode
    sources: [SRC01, SRC02]
- id: light
  title: 'Light｜贴身低段 / 紧急确认'
  stage: S0
  subtitle: '只保留稳定收尾与真正不同的 Oki 收尾'
  guide:
    short: 'Light 的重点是确认纪律：Hit 才提交，Block 停；第二答案只为 Oki 存在。'
    play_target: T01
  rows:
  - result: BLOCK
    stage: S0
    choice: 停止提交
    input: '不把轻链自动播进 623HP'
    value: {drive: 0}
    next_loop: '停 / 重读'
    why: '能连不等于被防也该把尾段播完。'
  - result: HIT
    stage: S0
    choice: 默认稳定
    input: '2LK > 5LP > 5LP xx 623HP'
    value: {damage: 1690, drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '轻确认最稳答案；小机会也能直接接入主循环。'
    verification: verified
    sources: [SRC03]
  - result: HIT
    stage: S1
    choice: Oki优先
    input: '2LK > 5LP > 5LP xx 214LK'
    value: {damage: 1340, drive: 0, oki: alternate}
    next_loop: '66 -> 214LP active-frame meaty'
    why: '少约 350 伤害，换另一套起攻结构。'
    verification: verified
    sources: [SRC03]
- id: 2mk
  title: '2MK｜低段 DRC 结构化入口'
  stage: S2
  subtitle: '先分 Whiff / Block / Hit，再决定资源'
  guide:
    short: 'S2 学状态判断；S3 才学为什么偏离默认；S4 长串只在 Kill 条件出现。'
    play_target: T03
  rows:
  - result: WHIFF
    stage: S2
    choice: 不交DRC
    input: '2MK whiff -> stop'
    value: {drive_saved: 3}
    next_loop: '回距离'
    why: 'Drive 用来买机会，不为挥空补票。'
  - result: BLOCK
    stage: S2
    choice: 分状态
    input: '未 DRC: 结束接触 | 已 DRC: 进入近身判断'
    value: {drc_cost: 3}
    next_loop: '未 DRC -> Neutral | 已 DRC -> strike / throw / shimmy / stop'
    why: '必须区分“2MK 被防”和“已经花 3 格进入 DRC 压力”。'
  - result: HIT
    stage: S2
    choice: 默认
    input: '2MK > DRC > 5HP > 4HP xx 623HP'
    value: {damage: 2234, drive: 3, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '3 Drive 买稳定伤害和熟悉的 +37。'
    verification: verified
    sources: [SRC01, SRC03]
  - result: HIT
    stage: S3
    choice: Denjin
    input: '2MK > DRC > 5HP > 4HP xx 236HK > 22P'
    value: {damage: 2183, drive: 3, resource: Denjin}
    next_loop: '22P -> 下一轮强化'
    why: '只比默认少约 51 伤害；安全能蓄电时是真正的价值分叉。'
    verification: conditioned
    conditions: [safe_charge_window, spacing]
    sources: [SRC03]
  - result: HIT
    stage: S4
    choice: SA3简单收局
    input: '2MK > DRC > 5HP > 4HP xx 623HP xx SA3'
    value: {damage: 4234, drive: 3, sa: 3}
    next_loop: 'Round End / 大幅压血'
    why: '接近收局时才出现；平时不占工作记忆。'
    verification: provisional
    verify: training_mode
    sources: [SRC01, SRC03]
  - result: HIT
    stage: S4
    choice: Lethal
    input: '2MK > DRC > 5HP > 4HP > DRC > 5HK > 5HP > 623HP xx SA3'
    value: {damage: 4603, drive: 6, sa: 3}
    next_loop: Kill
    why: '比简单 SA3 多约 369；只有斩杀线才值得增加执行负担。'
    verification: provisional
    verify: training_mode
    sources: [SRC01, SRC03]
- id: punish
  title: 'Punish / PC｜Shimmy、无敌技防住、Drive Reversal'
  stage: S1
  subtitle: '大破绽只保留稳定 / 位置 / Kill'
  guide:
    short: '先看见 tech whiff / reversal 后稳定重罚；S3 再按位置换 carry，S4 才看最大伤害。'
    play_target: T04
  rows:
  - result: PC
    stage: S1
    choice: 默认稳定
    input: '5HK (PC) > 5HP xx 623HP'
    value: {damage: 3000, drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '高伤、0 Drive、低认知负担。'
    verification: verified
    sources: [SRC03]
  - result: PC
    stage: S2
    choice: D-Reversal稳定
    input: '5MP (PC) > 5HP xx 623HP'
    value: {damage: 2640, drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '挡住 Drive Reversal 后用固定答案，不临场现编。'
    verification: verified
    sources: [SRC03]
  - result: PC
    stage: S3
    choice: Carry
    input: '5HK (PC) > 66 > 2HP xx 214MK'
    value: {damage: 2680, drive: 0, carry: high}
    next_loop: '按 214MK 命中状态进入对应 Oki'
    why: '少约 320 伤害换位置；墙角价值高时才偏离稳定线。'
    verification: conditioned
    sources: [SRC03]
  - result: PC
    stage: S4
    choice: 最大斩杀
    input: '5HK PC > 2HP > DRC > 5HK > 2HP > DRC > 5HK > 2HP > 623HP xx SA3'
    value: {damage: 6051, drive: 6, sa: 3}
    next_loop: Kill
    why: '只有资源和血量都允许收局时才显示。'
    verification: provisional
    verify: training_mode
    sources: [SRC03]
- id: di
