- id: denjin
  title: 'Denjin｜当前收益换下一轮资源 / 决策权'
  stage: S3
  subtitle: '只在安全窗口或明确强化接触里加入'
  guide:
    short: 'Denjin 是资源转换，不是独立第二套角色。没有安全窗口就不硬蓄。'
    play_target: T06
  rows:
  - result: SAFE_WINDOW
    stage: S3
    choice: 蓄电
    input: '22P -> Denjin'
    value: {resource: Denjin}
    next_loop: 'Neutral / 强化下一次接触'
    why: '用安全空档把价值移到下一轮。'
    verification: verified
    sources: [SRC01, SRC03]
  - result: BLOCK
    stage: S3
    choice: '+4'
    input: 'Denjin OD214P blocked -> +4'
    value: {drive: 2, frame: '+4'}
    next_loop: '投 / 5LP / 2MP / Shimmy'
    why: '这里是真正花资源买到近身决策权。'
    verification: verified
    sources: [SRC01, SRC03]
  - result: HIT
