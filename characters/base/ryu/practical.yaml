- id: forward
  title: '6HP / Raw DR｜复用已经会的 Ender'
  stage: S2
  subtitle: '新起手，不新增一套收尾体系'
  rows:
  - result: HIT
    stage: S2
    choice: Carry
    input: '6HP > 2MP > OD236K > 6HK > j.214K'
    value: {damage: 3140, extra_drive: 2, carry: high}
    next_loop_package: OD_HBK_CARRY
    why: '新起手，但复用已经学会的 OD236K Ender。'
    verification: verified
