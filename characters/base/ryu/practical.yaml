    why: '这是一个 route family；起手不同，但资源兑现目标相同。'
    verification: conditioned
    sources: [SRC03]
backend_only:
- label: 'Corner Drive Reversal 最大伤害'
  reason: '主来源字符串仍未闭合；BLOCKED_VERIFY。'
- label: 'Air-to-air / Hashogeki launch'
  reason: '保留候选，但要 Year4 Training Mode 收口高度与 timing。'
- label: '长双 DRC / SA3'
  reason: '已给计算值；最终 canonical 前再做 Training Mode exact check。'
- label: '旧 Year3 派生路线'
