    play_target: T05
  rows:
  - result: WALL_SPLAT
    stage: S2
    choice: 省资源
    input: 'DI wall splat > 2HP xx 214MP > 623HP'
    value: {damage: 2176, extra_drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '已经有墙，不需要再为运版付钱。'
    verification: verified
    sources: [SRC03]
  - result: WALL_SPLAT
    stage: S3
    choice: 伤害
    input: 'DI > 4HP > 236HK > 623MP'
    value: {damage: 3230, extra_drive: 0}
    next_loop: 'Corner pressure'
    why: '同是墙角机会，这条买的是当前火力。'
    verification: verified
    sources: [SRC03]
  - result: DI_PC_MID
    stage: S2
    choice: Easy
    input: 'DI (PC) > 6HP > 2MP xx 623HP'
    value: {damage: 2860, extra_drive: 0, kd: '+37'}
    next_loop_package: HPDP_PLUS37
    why: '版中 DI 的低认知负担稳定答案。'
    verification: verified
    sources: [SRC03]
  - result: DI_PC_MID
    stage: S3
    choice: 'Carry + Oki'
    input: 'DI (PC) > 6HP > 2MP > OD236K > 6HK > j.214K'
    value: {damage: 3260, extra_drive: 2, carry: high}
    next_loop_package: OD_HBK_CARRY
    why: '比 Easy 多约 400，又获得运版和近身 Oki。'
    verification: conditioned
    sources: [SRC03]
  - result: DI_PC_BACK_TO_CORNER
    stage: S3
    choice: Side Switch
    input: 'DI (PC) > crumple 中 walk/66 > 2HP > OD236K > 66 > 623MP'
    value: {damage: 2880, extra_drive: 2, side_switch: true}
