    - {input: '2MP', name: 'Crouching Medium Punch', startup: '6', active: '6-9', recovery: '13', hit: '+5', block: '0', cancel: 'C', damage: '600', note: '挥空额外 +2F recovery。'}
    - {input: '2MK', name: 'Crouching Medium Kick', startup: '8', active: '8-10', recovery: '19', hit: '+1', block: '-6', cancel: 'C', damage: '500', note: '主低段 DRC 入口。'}
    - {input: '2HP', name: 'Crouching Heavy Punch', startup: '9', active: '9-14', recovery: '22', hit: '+1', block: '-7', cancel: 'C', damage: '800', note: 'Active 1 命中时强制站立。'}
    - {input: '2HK', name: 'Crouching Heavy Kick', startup: '9', active: '9-11', recovery: '23', hit: 'KD', block: '-12', cancel: '-', damage: '900', note: 'PC 延长 KD / Hard Knockdown。'}
