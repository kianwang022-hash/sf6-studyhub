  path: [N02, T01, R01, E01, O01, T02, N02]
  label: '236P / 5MK 控距离；跳就 623P；5MP / 轻攻击命中转稳定击倒；击倒后接固定起攻。'
role_profile:
  identity:
    one_line: '标准型：用 236P 与中距离拳脚控制前进和跳跃，接触后靠稳定击倒反复起攻。'
    preferred_range: '中距离进入 5MP / 2MK 的确认距离；远处用 236P 管线，跳入用 623P。'
    win_pattern: '控地面 -> 逼跳/逼防 -> 命中确认 -> Ender -> 固定 Oki -> 再次接触。'
    lose_pattern: '挥空重拳、错误提交 unsafe 尾段、为了 Denjin 放弃安全局面、把条件 Oki 当成通用数字。'
  tools:
  - {input: '236P', name: 'Hadoken', use: '远中距控线；逼对手跳、Parry 或改变走位。'}
  - {input: '623P', name: 'Shoryuken', use: '主反空；反空命中后按实际高度重读，不套地面 +37。'}
  - {input: '5MP', name: 'st.MP', use: '近身主确认；Hit +7 可接 2MP，Block -1 默认停手。'}
  - {input: '2MK', name: 'cr.MK', use: '中距离低段 DRC 入口；Whiff / Block / Hit 必须分开。'}
  - {input: '5HK', name: 'st.HK', use: 'Shimmy / 大确反 PC 的高价值入口。'}
  - {input: '6HP', name: 'Solar Plexus Strike', use: '前进重拳；Block +3，可进入投 / Shimmy；Hit 可接运版路线。'}
  - {input: '22P', name: 'Denjin Charge', use: '安全窗口换未来资源；没有窗口就不硬蓄。'}
  normal_frame_table:
    source_id: SRC02
    scope: '完整 18 个基础 Normal；Unique / TC / Special 继续由核心工具与 Reference 承担。'
    columns: [input, name, startup, active, recovery, hit, block, cancel, damage, note]
    rows:
