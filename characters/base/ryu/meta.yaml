    - {input: 'j.HK', name: 'Jumping Heavy Kick', startup: '10', active: '10-17', recovery: 'Landing 3', hit: '-', block: '-', cancel: '-', damage: '800', note: ''}
  resource:
    name: Denjin
    input: '22P'
    gain: '安全窗口完成蓄电。'
    changes: '强化部分 236P / 214P 路线与近身资源价值。'
    rule: '只有未来收益高于当前 Oki / 位置时才换。'
  key_numbers:
  - {label: '5MP', value: '6F / Hit +7 / Block -1', decision: 'Hit 可确认；Block 默认停。'}
  - {label: '2MK', value: '8F / Hit +1 / Block -6', decision: 'DRC 是资源型入口，不自动提交。'}
  - {label: '6HP', value: '20F / Hit +6 / Block +3', decision: 'Block 后有真实近身决策权。'}
  - {label: '623HP grounded combo', value: 'KD +37', decision: '66 后接固定 Oki；仅普通地面连段。'}
  - {label: 'Denjin OD214P block', value: '+4', decision: '花 2 Drive 买近身正帧。'}
  - {label: '+42 state', value: '236LK grounded / 236HK airborne', decision: '前跳 j.HK Safe Jump。'}
  constraints:
  - '623HP 反空命中高度会改变落点；不能复用地面连段 +37。'
  - '2MK 被防但没 DRC 时，接触结束；不要把它当成已经进入压力。'
  - 'OD236K 换边 / 运版受 starter、距离和高度影响，必须看条件。'
  - 'Denjin 是路线资源，不是“有机会就一定蓄”的目标。'
unlock_ladder:
- {level: Lv0, state: PLAYABLE, goal: '236P / 5MK 控地面；跳就 623P；5MP 与轻攻击各有一条稳定确认；623HP 后固定接 66 -> 6HP。'}
- {level: Lv1, state: KNOCKDOWN, goal: '加入基础 Oki、Shimmy / PC 惩罚、角落投循环和 OD236K 运版。'}
- {level: Lv2, state: ADAPT, goal: '加入 2MK DRC、DI 与 Drive Reversal 场景；先认清 Whiff / Block / Hit。'}
- {level: Lv3, state: SIGNATURE, goal: '同一机会开始按位置、Drive、Oki 与 Denjin 选择不同路线。'}
- {level: Lv4, state: OPTIMIZE, goal: '加入 +42 Safe Jump、Kill、最大伤害与 spacing / airborne 条件优化。'}
starter_courses:
- {id: COURSE01, label: '打通 S0 一整轮', level: Lv0, target: O01, summary: '236P / 5MK 控地面 -> 5MP 命中确认 -> 623HP -> 66 -> 6HP。'}
- {id: COURSE02, label: '补轻攻击确认', level: Lv0, target: T01, summary: '2LK -> 5LP -> 5LP -> 623HP；与 5MP 路线共用 +37 Oki。'}
- {id: COURSE03, label: '加入 2MK DRC', level: Lv2, target: T03, summary: '先分 Whiff / Block / Hit，再决定是否花 3 Drive。'}
- {id: COURSE04, label: '加入 Punish / DI', level: Lv2, target: C01, summary: '挡无敌、Shimmy、DI 成功后使用固定路线，不临场现编。'}
- {id: COURSE05, label: '开始做价值选择', level: Lv3, target: T06, summary: '默认伤害、运版、位置、Denjin 之间只保留真正不同的答案。'}
- {id: COURSE06, label: '最后加入条件优化', level: Lv4, target: T08, summary: '+42 Safe Jump、Kill、最大伤害与条件路线。'}
side_tools: {reference: true, notes_hook: true}
site: {hero_assets_migrated: false, render_verified: false, gold: false}
