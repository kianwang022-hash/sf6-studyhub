    - {input: '5MP', name: 'Standing Medium Punch', startup: '6', active: '6-9', recovery: '11', hit: '+7', block: '-1', cancel: 'C', damage: '600', note: '挥空额外 +2F recovery。'}
    - {input: '5MK', name: 'Standing Medium Kick', startup: '9', active: '9-11', recovery: '18', hit: '+4', block: '-4', cancel: '-', damage: '700', note: ''}
    - {input: '5HP', name: 'Standing Heavy Punch', startup: '10', active: '10-14', recovery: '18', hit: '+4', block: '-2', cancel: 'C', damage: '800', note: '强制站立。'}
    - {input: '5HK', name: 'Standing Heavy Kick', startup: '12', active: '12-15', recovery: '20', hit: '+9', block: '+1', cancel: '-', damage: '900', note: '空中命中 launch；PC 膝崩。'}
    - {input: '2LP', name: 'Crouching Light Punch', startup: '4', active: '4-5', recovery: '9', hit: '+4', block: '-1', cancel: 'C', damage: '300', note: '可连打取消。'}
