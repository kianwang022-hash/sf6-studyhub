schema_version: '1.0'
character: mai
status: CONTENT_READY
role_profile:
  identity:
    one_line: '火舞先靠飞扇和中距离拳脚正常拿机会；真正的特色是把普通命中升级成更好的击倒、位置、安全跳或强化状态。'
    preferred_range: '中距离。用 236P 飞扇、2MK/2MP/5HP 管地面；拿到命中后再按资源、位置和想要的下一轮分流。'
    win_pattern: '飞扇/拳脚控中距离 -> 普通确认到稳定收尾 -> 有资源/位置条件时升级路线 -> 拿更强 Oki/安全跳/角落状态 -> 再逼一次。'
    lose_pattern: '把飞扇当唯一 neutral、见到强化资源就只追最高伤害、把 Boosted 当第二套死 Combo 表、误以为 OD 214P 被防后自动轮到自己。'
  character_model:
    essence_short: '先用很标准的中距离骨架拿到开口，再决定要不要花资源把这次普通命中升级成更强的下一轮。'
    essence_detail: '火舞不是“飞扇角色 + 一堆华丽 Combo”这么简单。她先用 236P 飞扇和中距离拳脚让对手不能无脑往前，再靠 2MK、2MP、5HP 等按钮拿到普通接触，接 236K 突进踢或其他稳定收尾。她真正有特色的地方，是同一个命中并不只看伤害，而是看能不能换成更有价值的下一轮：更好的位置、更强击倒、安全跳、角落转换，或者进入“有强化资源”的状态。强化状态下，一部分招式会变成更强版本，所以路线价值会随资源而改变。Year4 的 OD 214P 也让她更像一个“状态转换”角色——它可以参与中场转换，但被防仍是 -3，不是自动正帧续压。于是她每次命中都在问：这次只拿稳定收益，还是花 Drive/资源把它加工成更强的下一回合？'
    force_opponent_to:
    - '尊重飞扇和中距离拳脚，不能只直线往前。'
    - '在跳、Parry、后退和站着防之间做选择。'
    payoff_after_respect:
    - '稳定地面确认和前冲起攻。'
    - '有资源时进入强化动作/更强路线。'
    - '把命中换成安全跳、角落位置或更强下一轮。'
    core_tradeoff: '稳定当前收益 vs 花 Drive / 强化资源把这次开口升级成更强状态。不是所有强化路线都只为了多打伤害。'
    successful_round:
    - '飞扇/拳脚控制中距离'
    - '逼对手跳、防或改走位'
    - '普通命中先拿稳定 Ender'
    - '有资源/位置时升级转换'
    - '拿更强 Oki / 安全跳 / 角落'
    - '资源消失后回到标准地面骨架'
    common_misplays:
    - '把飞扇当唯一 neutral，地面按钮和确认没建立。'
    - '把强化状态当第二套 Combo 表，不理解它到底改变了什么价值。'
    - '只追高伤，忽略安全跳、carry 和下一轮。'
    - '把 OD 214P 被防 -3 误读成正帧。'
    unique_decision: '标准角色也会做伤害/Oki取舍，但火舞多了一层“有没有强化资源、现在的位置怎样、要把命中加工成哪种下一轮”的状态化路线选择。'
    transfer_in:
    - '飞道/跳跃博弈、普通 footsie、2MK 取消绿冲。'
    - '打 / 投 / 骗拆、PC/DI/角落转换。'
    new_skill:
    - '强化资源 -> 强化状态 -> 路线价值改变。'
    - '同一 starter 按 end-state 和屏幕位置分流。'
    unlearn:
    - '有飞道就等于 zoner。'
    - '花资源一定等于追最高伤害。'
    - 'OD 214P 被防就自动轮到我。'
  glossary:
  - {term: '强化资源（Stock）', meaning: '角色持有的一层强化资源；会让一部分动作进入更强版本。精确获得/消耗继续按当前 Source Closure 细分。'}
  - {term: '强化状态（Boosted）', meaning: '满足资源条件时，部分必杀/Super 变成更强版本；不是第二个角色，而是当前状态下的强化。'}
  - {term: 'OD 214P｜耗 Drive 的强化旋转火焰攻击', meaning: 'Overdrive 版 214P；Year4 可用于中场转换，但被防后约 -3，不是自动正帧。'}
  - {term: 'j.214P｜空中转换/安全跳工具（Musasabi）', meaning: '部分路线用它换到高帧差、安全跳或更强下一轮。'}
  tools:
  - {input: '236P', name: '飞扇 | Kachousen', use: '中远距离控制；逼跳、Parry 或改变走位。'}
  - {input: '2MK', name: '蹲中脚', use: '7F 可取消低段；常见取消绿冲入口。'}
  - {input: '5HP', name: '站重拳', use: '9F 可取消的中距离确认/惩罚按钮。'}
  - {input: '236K', name: '向前突进踢 | Shinobi Bachi', use: '基础稳定收尾家族；不同强度会给不同下一轮。'}
  - {input: '214P', name: '旋转火焰攻击 | Ryuuenbu', use: '近身/连段转换；OD 版本是 Year4 重要状态化工具。'}
  - {input: '623K', name: '升空踢 | Hishou Ryuuenjin', use: '反空/收尾工具；角落和空中高度会改变后续。'}
  - {input: 'j.214P', name: '空中转换 | Musasabi', use: '部分路线用于安全跳/更强下一轮；高度和位置必须显式看条件。'}
