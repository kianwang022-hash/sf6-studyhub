  resource:
    name: '强化资源 / 强化状态'
    input: 'SA1 236236P 等来源'
    gain: '当前 Year4 路线中，SA1 等场景会进入强化资源/强化版本状态；精确来源和消耗按 Source Closure 继续细分。'
    changes: '部分 236P、214P、236K、j.214P 和 Super 会进入强化版本，改变伤害、帧差或后续价值。'
    rule: '先问“这份资源能不能把当前开口换成更好的下一轮”，而不是只因为有 Boosted 就追最高伤害。'
  key_numbers:
