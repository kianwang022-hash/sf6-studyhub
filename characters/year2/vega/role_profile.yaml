  - {input: '5MP', name: '站中拳', use: '8F / Hit +6 / Block 0 / C；稳定ground confirm。'}
  - {input: '2MP', name: '蹲中拳', use: '6F / Hit +5 / Block -1 / C；主要confirm。'}
