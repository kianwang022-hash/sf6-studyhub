schema_version: '1.0'
character: vega
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Bison先用Backfist把Psycho Mine种到对手身上；Mine存在后，同一个Crusher/Backfist/Devil Reverse会变成完全不同的风险收益状态。'
    preferred_range: '中近距离。5MP/2MP/2MK先拿contact，Backfist负责植Mine；Mine存在后再决定现在cash-in还是让状态继续威慑。'
    win_pattern: 'ground contact -> Backfist植Mine -> +31/DR Oki -> Mine威慑 -> Mine-enhanced Backfist/Crusher/Devil Reverse cash-in -> +42/+49/+82 or plus pressure -> detonate -> replant later。'
    lose_pattern: '没Mine时把Crusher当安全进场、有Mine就马上爆、忘记Crusher/Shadow Rise还需要charge、把normal/Mine版本混成一套、过早围着air/high-resource routes打。'
  character_model:
    essence_short: 'Bison真正的新技能是双状态管理：自己有没有charge、对手身上有没有Mine；同一个special会因为Mine状态而从大负帧变成正帧/高Oki。'
    essence_detail: 'M. Bison是Charge章最后一个很好的转折点：他确实需要保存Psycho Crusher / Shadow Rise的charge，但真正的新技能是“对手身上的状态”。没有Mine时，Psycho Crusher和Backfist被防都非常危险；一旦Backfist命中把Mine植入，对手下一次面对这些special时风险结构直接改变，例如L/M Crusher从block -20变成+6，H Backfist从-15变成+9，OD Crusher从-3变成+10。Mine因此不是多一点伤害的被动buff，而是让同一个special在下一个回合变成另一种招。当前Game Plan也支持这个循环：普通contact -> Backfist植Mine -> H Backfist +31 / DR Oki -> overhead/low/throw/shimmy -> Mine-enhanced Crusher/Backfist兑现 -> +42/+49/+82等大Oki或正帧pressure -> detonation后重新回普通状态。成熟Bison不是有Mine就马上爆，而是知道Mine存在本身就能让对手更怕special；如果当前pressure不需要马上兑现，可以让状态继续影响对手决策。反过来，没有Mine时也不能把Crusher当安全进场。charge和Mine要同时被追踪。'
    force_opponent_to:
    - '尊重5HP block +1与4HK block +1的普通正帧接触。'
    - 'normal Backfist命中后开始处理下一次special可能引爆Mine的威胁。'
    - 'Mine存在时，不敢把Crusher/Backfist/Devil Reverse按普通负帧special处理。'
    - '+42/+49等大预算后继续处理overhead / low / throw / shimmy。'
    payoff_after_respect:
    - 'Mine存在本身就让对手更难放心按normal punish。'
    - 'Mine Crusher/Backfist可从大负帧变成+5~+10。'
    - 'Mine Backfist/Crusher进入+42以上safe-jump/pressure预算。'
    - 'Devil Reverse在Mine状态下变成极高plus值空中pressure。'
    - '对手为了等Mine或躲detonation僵住后，throw/low/shimmy更强。'
    core_tradeoff: '现在引爆Mine兑现plus/damage/Oki vs 继续保留Mine作为未来威胁；同时还要判断charge是否够，Crusher cash-in并不是随时可用。'
    successful_round:
    - '5MP/2MP/light拿contact'
    - 'Backfist结束combo并植Mine'
    - '普通+31/DR Oki继续高低投'
    - '对手开始尊重Mine special'
    - '选择Mine Backfist / Crusher / Devil Reverse cash-in'
    - 'detonation后回normal route重新植Mine'
    common_misplays:
    - '没Mine时把Crusher当安全pressure。'
    - 'normal Backfist被防还以为因为会种Mine就安全。'
    - '有Mine就立即引爆，不看Mine威慑价值。'
    - '忘记Crusher/Shadow Rise还需要charge。'
    - '把+42当普通Backfist/Crusher通用结果。'
    unique_decision: 'Bison新增的是“对手状态 + 自己charge”双状态管理：同一个special的意义会随Mine有无彻底改变。'
    transfer_in:
    - 'Guile/Dee Jay/Honda的charge availability纪律。'
    - 'grounded contact / DRC / strike-throw-shimmy。'
    - 'punish / corner / Oki。'
    new_skill:
    - 'Psycho Mine植入 / 保留 / 引爆循环。'
    - 'normal vs Mine-enhanced move truth。'
    - 'hold Mine vs detonate Mine。'
    - 'simultaneous Mine + charge tracking。'
    - 'state-aware air pressure。'
    unlearn:
    - 'special帧差是固定属性。'
    - '有状态就应该马上消费。'
    - 'charge是唯一需要追踪的状态。'
    - 'normal和Mine版本可以合并成一个learner row。'
  glossary:
  - {term: 'Psycho Mine', meaning: 'Backfist命中后植到对手身上的状态；会自爆，也可被Backfist/Crusher/Devil Reverse触发。'}
  - {term: '[4]6P｜Psycho Crusher', meaning: 'charge cash-in工具。normal版本被防很危险；Mine版本可直接变成+5~+10。'}
  - {term: '214P｜Backfist Combo', meaning: 'normal命中用于植Mine；Mine存在时会引爆并进入+42/+49等高Oki。'}
  - {term: '22K｜Shadow Rise', meaning: 'down-charge空中入口，后续Head Press/Devil Reverse；Mine状态会改变Devil Reverse风险。'}
  - {term: '236K｜Double Knee Press', meaning: 'non-charge route/pressure工具，用来在没charge或不想cash Mine时继续普通回合。'}
