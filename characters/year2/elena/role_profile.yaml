schema_version: '1.0'
character: elena
status: CONTENT_READY
role_profile:
  identity:
    one_line: 'Elena先用快地面接触拿稳定击倒；击倒后再用Lynx Song把overhead / low / throw / shimmy组织成同一个mix hub，Healing只在后期进入。'
    preferred_range: '中近距离。5MK、2MK、light拿接触，先用Spinning Scythe或Rhino Horn拿清楚end state，再决定是否进入Lynx Song。'
    win_pattern: 'ground contact -> Spinning Scythe / Rhino Horn -> Oki -> Lynx Song mix hub -> high / low / throw / shimmy -> corner safe jump -> later SA2 damage-vs-healing choice。'
    lose_pattern: '一上来背满Lynx派生、把Healing当角色主线、把+42 safe jump当通用、忽略Rhino/Scratch Wheel的高度与spacing条件。'
  character_model:
    essence_short: '先把地面contact换成稳定击倒，再把Lynx Song当下一轮的选择中心；Healing不是入门主线，而是后期把已有优势换成恢复的额外选择。'
    essence_detail: 'Elena不是“有Healing所以先围着回血玩”的角色。当前资料最先给出的都是普通地面和稳定击倒：5MK只有6F而且被防+1，2MK在Year 4变成被防-3，light / medium contact可以用Spinning Scythe或Rhino Horn收尾。真正属于Elena的第二层发生在击倒以后：Spinning Scythe、Rhino Horn、Harvest Circle等end state给她时间进入Lynx Song，再从Mallet Smash overhead、2MK low、throw、shimmy之间组织下一轮。也就是说，她的特色不是“更快地再次贴脸”，而是把一次击倒变成一个结构化mix hub。到更后面，SA2 Revival Dance才加入新的资源问题：这次Super更应该拿伤害/Oki，还是用Healing variation恢复生命并补Drive。Healing很特别，但它应该放大已经建立的角色循环，而不是替代地面确认、反空和Oki。'
    force_opponent_to:
    - '先尊重5MK block +1和快地面按钮。'
    - '被Spinning Scythe / Rhino Horn击倒后处理Elena下一轮的高 / 低 / 投 / shimmy。'
    - '进入Lynx Song有效setup后，不能只用一种固定防守规则。'
    payoff_after_respect:
    - 'Mallet Smash overhead与2MK low更容易成立。'
    - 'throw / shimmy开始惩罚只会站防或固定拆投。'
    - '角落M Spinning Scythe +42进入safe jump。'
    - '后期SA2可以选择伤害/Oki或Healing恢复生命/Drive。'
    core_tradeoff: '稳定击倒与低认知负担 vs 更复杂Lynx Song mix；后期再加入SA2当前伤害/Oki vs Healing恢复的取舍。'
    successful_round:
    - '5MK / 2MK / light拿ground contact'
    - 'Spinning Scythe或Rhino Horn拿击倒'
    - '先跑简单Oki'
    - 'S1以后进入Lynx Song mix'
    - '角落用+42 safe jump放大机会'
    - '有SA2时再比较伤害与Healing价值'
    common_misplays:
    - '因为有Healing就过早围着SA2打。'
    - '第一天把Lynx Song全部派生一起背。'
    - '把M Spinning Scythe +42当成任何位置都能safe jump。'
    - '把Rhino Horn / Scratch Wheel后续数字当固定值。'
    unique_decision: 'Elena新增的是“击倒后的mix hub组织”：Lynx Song把overhead / low / throw / shimmy集中到同一个下一轮结构里；Healing是后期的恢复分支。'
    transfer_in:
    - '快地面contact、strike / throw / shimmy。'
    - 'anti-air / punish / corner / Oki。'
    - 'CDR / Super cashout基础。'
    new_skill:
    - '识别哪些ender真正给Lynx Song setup时间。'
    - '在同一mix hub里组织overhead / low / throw / shimmy。'
    - '+42 safe jump只在正确corner Spinning Scythe状态使用。'
    - 'SA2伤害/Oki vs Healing恢复的后期选择。'
    unlearn:
    - 'mobility character就应该一直重新突进。'
    - '有Healing就应该尽早围着回血打。'
    - 'mix选项越多越应该S0全学。'
  glossary:
  - {term: '214K｜Spinning Scythe', meaning: 'Elena最常见击倒家族之一。L / M / H当前约+34 / +42 / +52；不同版本承担不同Oki预算。'}
  - {term: '236K｜Rhino Horn', meaning: '前进end​​er/路线工具。M版grounded hit当前+39；高度和spacing会改变后续。'}
  - {term: '236P｜Lynx Song', meaning: '击倒后mix hub，可接Leopard Snap、Harvest Circle、Mallet Smash或Lynx Whirl。只有赚到setup时间时才真正强。'}
  - {term: '6HK follow-up｜Mallet Smash', meaning: 'Lynx Song里的overhead分支。普通版block -3；Boosted版block +3。'}
  - {term: 'SA2｜Revival Dance', meaning: '后期Super选择：普通伤害分支，或Healing variation恢复生命并补Drive。'}
  tools:
  - {input: '5MK', name: '站中脚', use: '6F / Hit +5 / Block +1 / C；S0核心respect与确认。'}
  - {input: '2MK', name: '蹲中脚', use: '9F / Hit +4 / Block -3；Year4更安全，但不可取消，不套Cammy/Juri 2MK DRC。'}
  - {input: '2HP', name: '蹲重拳', use: '9F；8–20F对空无敌，Year4二段空中命中更容易追击。'}
  - {input: '214LK', name: 'L Spinning Scythe', use: '基础light/low ender；当前+34 family。'}
  - {input: '236MK', name: 'M Rhino Horn', use: '中等contact ender；grounded hit当前+39 family。'}
  - {input: '236P', name: 'Lynx Song', use: 'S1以后打开mix hub；不是neutral自动mix。'}
  - {input: '623K', name: 'Scratch Wheel', use: '反空 / combo ender；OD版6F全无敌。'}
