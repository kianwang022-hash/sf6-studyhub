<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 545" role="img" aria-label="方向是游戏读到的结果，不只是手指动作"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">方向是游戏读到的结果，不只是手指动作</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="35" y="115" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="51" y="145" class="label" text-anchor="start">7 ↖</text><rect x="123" y="115" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="139" y="145" class="label" text-anchor="start">8 ↑</text><rect x="211" y="115" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="227" y="145" class="label" text-anchor="start">9 ↗</text><rect x="35" y="203" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="51" y="233" class="label" text-anchor="start">4 ←</text><rect x="123" y="203" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="139" y="233" class="label" text-anchor="start">5 ·</text><rect x="211" y="203" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="227" y="233" class="label" text-anchor="start">6 →</text><rect x="35" y="291" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="51" y="321" class="label" text-anchor="start">1 ↙</text><rect x="123" y="291" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="139" y="321" class="label" text-anchor="start">2 ↓</text><rect x="211" y="291" width="78" height="76" rx="12" fill="#edf3f5" stroke="#cddcde"/><text x="227" y="321" class="label" text-anchor="start">3 ↘</text><text x="37" y="409" class="small" text-anchor="start">统一按面朝右记谱；换边水平镜像。</text><rect x="375" y="140" width="195" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="391" y="170" class="label" text-anchor="start">① 按下</text><text x="391" y="199" class="body" text-anchor="start">游戏收到 2</text><rect x="585" y="140" width="195" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="601" y="170" class="label" text-anchor="start">② 下不松，加前</text><text x="601" y="199" class="body" text-anchor="start">游戏收到 3</text><rect x="795" y="140" width="195" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="811" y="170" class="label" text-anchor="start">③ 松下，前＋P</text><text x="811" y="199" class="body" text-anchor="start">游戏收到 6＋P</text><path d="M570,203 L580,203" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M780,203 L790,203" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="375" y="315" width="615" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="391" y="345" class="label" text-anchor="start">236P 的检查顺序</text><text x="391" y="374" class="body" text-anchor="start">方向是否完整 → 最后拳是否落在有效窗口</text><text x="391" y="399" class="body" text-anchor="start">P 太早可能出蹲拳；太晚或缺斜向可能出别的招</text><text x="32" y="501" class="small" text-anchor="start">SOCD 组合另查硬件清洗模式；“物理按628”不保证游戏收到字面628。</text></svg>