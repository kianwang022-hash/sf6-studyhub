<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 595" role="img" aria-label="把“训练场会了”迁移成“真人能用”"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">把“训练场会了”迁移成“真人能用”</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><circle cx="80" cy="132" r="23" fill="#176b70"/><text x="80" y="139" class="label" text-anchor="middle" style="fill:white">1</text><rect x="125" y="102" width="825" height="68" rx="10" fill="white" stroke="#cddcde"/><text x="145" y="130" class="label" text-anchor="start">固定条件</text><text x="400" y="130" class="body" text-anchor="start">先验证连接，不把动作练错</text><path d="M80,156 L80,183" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><circle cx="80" cy="214" r="23" fill="#176b70"/><text x="80" y="221" class="label" text-anchor="middle" style="fill:white">2</text><rect x="125" y="184" width="825" height="68" rx="10" fill="white" stroke="#cddcde"/><text x="145" y="212" class="label" text-anchor="start">随机结果</text><text x="400" y="212" class="body" text-anchor="start">命中继续，被防停止危险末键</text><path d="M80,238 L80,265" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><circle cx="80" cy="296" r="23" fill="#176b70"/><text x="80" y="303" class="label" text-anchor="middle" style="fill:white">3</text><rect x="125" y="266" width="825" height="68" rx="10" fill="white" stroke="#cddcde"/><text x="145" y="294" class="label" text-anchor="start">移动与干扰</text><text x="400" y="294" class="body" text-anchor="start">加入距离变化、走停、其他威胁</text><path d="M80,320 L80,347" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><circle cx="80" cy="378" r="23" fill="#176b70"/><text x="80" y="385" class="label" text-anchor="middle" style="fill:white">4</text><rect x="125" y="348" width="825" height="68" rx="10" fill="white" stroke="#cddcde"/><text x="145" y="376" class="label" text-anchor="start">真人限定应用</text><text x="400" y="376" class="body" text-anchor="start">每组只盯一两项，不只看输赢</text><path d="M80,402 L80,429" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><circle cx="80" cy="460" r="23" fill="#176b70"/><text x="80" y="467" class="label" text-anchor="middle" style="fill:white">5</text><rect x="125" y="430" width="825" height="68" rx="10" fill="white" stroke="#cddcde"/><text x="145" y="458" class="label" text-anchor="start">回看一个问题</text><text x="400" y="458" class="body" text-anchor="start">区分没看见、选错、输入错与不能动</text><text x="32" y="568" class="small" text-anchor="start">通过率只是练习反馈；要有跨日与实际机会，不能把一次成功当成掌握。</text></svg>