<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" aria-label="对空不是一项动作，而是一条限时决策链"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">对空不是一项动作，而是一条限时决策链</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="35" y="150" width="220" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="51" y="180" class="label" text-anchor="start">发现</text><text x="51" y="209" class="body" text-anchor="start">注意到真正的跳入</text><rect x="285" y="150" width="220" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="301" y="180" class="label" text-anchor="start">选择</text><text x="301" y="209" class="body" text-anchor="start">距离 / 面向 / 轨迹</text><rect x="535" y="150" width="220" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="551" y="180" class="label" text-anchor="start">输入</text><text x="551" y="209" class="body" text-anchor="start">招式与末键时机</text><rect x="785" y="150" width="220" height="125" rx="12" fill="white" stroke="#cddcde"/><text x="801" y="180" class="label" text-anchor="start">兑现</text><text x="801" y="209" class="body" text-anchor="start">判定碰到，得到后续</text><path d="M255,210 L278,210" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M505,210 L528,210" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M755,210 L778,210" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="80" y="330" width="880" height="120" rx="12" fill="white" stroke="#cddcde"/><text x="96" y="360" class="label" text-anchor="start">练习次序倒过来：先减少最容易减少的耗时</text><text x="96" y="389" class="body" text-anchor="start">固定跳入练输入 → 变距离练选择 → 加干扰练发现 → 真人检查盲区</text><text x="96" y="414" class="body" text-anchor="start">还在自己发波恢复里：先修发波决策，不只是再练一百次升龙。</text><text x="32" y="540" class="small" text-anchor="start">S09 原作者三阶段：发现 / 选择 / 输入；本图另加结果检查，属于教学组织。</text></svg>