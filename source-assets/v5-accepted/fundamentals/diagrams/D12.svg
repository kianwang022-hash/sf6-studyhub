<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" role="img" aria-label="两层教材各自负责一件事"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">两层教材各自负责一件事</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="60" y="130" width="410" height="200" rx="12" fill="white" stroke="#cddcde"/><text x="76" y="160" class="label" text-anchor="start">SF6 Fundamentals · 通用层</text><text x="76" y="189" class="body" text-anchor="start">为什么能连？为什么会被抢？</text><text x="76" y="214" class="body" text-anchor="start">什么时候有打投？为什么漏对空？</text><text x="76" y="239" class="body" text-anchor="start">我现在该选进击、先制还是差合？</text><rect x="570" y="130" width="410" height="200" rx="12" fill="white" stroke="#cddcde"/><text x="586" y="160" class="label" text-anchor="start">Ryu Mastery · 角色层</text><text x="586" y="189" class="body" text-anchor="start">具体用哪一个拳脚和强度？</text><text x="586" y="214" class="body" text-anchor="start">哪条连段、多少资源、什么收尾？</text><text x="586" y="239" class="body" text-anchor="start">这个击倒具体垫什么帧？</text><path d="M470,230 L560,230" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="210" y="375" width="620" height="87" rx="12" fill="white" stroke="#cddcde"/><text x="226" y="405" class="label" text-anchor="start">连接点：同一个局面，不再重复学两遍概念</text><text x="226" y="434" class="body" text-anchor="start">通用判断 → 隆的具体工具 → 真人结果 → 回到实际瓶颈</text><text x="32" y="491" class="small" text-anchor="start">旧Ryu册作为独立、未改写的角色参考；其版本边界仍保留。</text></svg>