<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585" role="img" aria-label="不是先背连段，而是认出当前局面"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">不是先背连段，而是认出当前局面</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="355" y="100" width="330" height="88" rx="12" fill="white" stroke="#cddcde"/><text x="371" y="130" class="label" text-anchor="start">立回：双方还能自由选择</text><text x="371" y="159" class="body" text-anchor="start">先看距离、接近方式与资源</text><path d="M520,188 L185,245" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="35" y="245" width="300" height="93" rx="12" fill="white" stroke="#cddcde"/><text x="51" y="275" class="label" text-anchor="start">命中</text><text x="51" y="304" class="body" text-anchor="start">NH / CH / PC → 稳定兑现</text><path d="M520,188 L505,245" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="355" y="245" width="300" height="93" rx="12" fill="white" stroke="#cddcde"/><text x="371" y="275" class="label" text-anchor="start">被防</text><text x="371" y="304" class="body" text-anchor="start">帧差 × 距离 → 继续或停手</text><path d="M520,188 L825,245" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="675" y="245" width="300" height="93" rx="12" fill="white" stroke="#cddcde"/><text x="691" y="275" class="label" text-anchor="start">挥空</text><text x="691" y="304" class="body" text-anchor="start">不能防的时间 → 承担风险</text><path d="M185,338 L265,400" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="100" y="400" width="380" height="115" rx="12" fill="white" stroke="#cddcde"/><text x="116" y="430" class="label" text-anchor="start">击倒：下一轮开始前先辨认</text><text x="116" y="459" class="body" text-anchor="start">有没有时间接近？能否进投距？</text><text x="116" y="484" class="body" text-anchor="start">打 / 投 / 骗拆 / 防凹</text><path d="M505,338 L745,400" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M825,338 L745,400" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="550" y="400" width="380" height="115" rx="12" fill="white" stroke="#cddcde"/><text x="566" y="430" class="label" text-anchor="start">不成立就结束当前计划</text><text x="566" y="459" class="body" text-anchor="start">回到合适距离，观察对手</text><text x="566" y="484" class="body" text-anchor="start">不是每次接触都必须继续按</text><text x="32" y="556" class="small" text-anchor="start">源框架：S03 三目标；S05 结果确认；S06–07 攻防；S10–11 立回。</text></svg>