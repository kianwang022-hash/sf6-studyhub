<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 505" role="img" aria-label="先判断落点，再决定是否与如何对空"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">先判断落点，再决定是否与如何对空</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><line x1="55" y1="355" x2="990" y2="355" stroke="#596f7a" stroke-width="3"/><path d="M325,310 Q245,90 155,310" stroke="#386fb2" stroke-width="4" fill="none" stroke-dasharray="7 5"/><circle cx="185" cy="325" r="23" fill="#386fb2"/><text x="115" y="405" class="label" text-anchor="start">前方正常跳入</text><text x="115" y="438" class="small" text-anchor="start">熟悉的正面对空</text><path d="M620,310 Q540,90 450,310" stroke="#176b70" stroke-width="4" fill="none" stroke-dasharray="7 5"/><circle cx="480" cy="325" r="23" fill="#176b70"/><text x="410" y="405" class="label" text-anchor="start">头顶／即将换边</text><text x="410" y="438" class="small" text-anchor="start">确认面向，避免向前钻空</text><path d="M915,310 Q835,90 745,310" stroke="#c18735" stroke-width="4" fill="none" stroke-dasharray="7 5"/><circle cx="775" cy="325" r="23" fill="#c18735"/><text x="705" y="405" class="label" text-anchor="start">远处垂直跳／变轨</text><text x="705" y="438" class="small" text-anchor="start">不够到就不乱交升龙</text><text x="32" y="480" class="small" text-anchor="start">图形只示意相对落点；不是固定跳弧、对空判定或全角色距离表。</text></svg>