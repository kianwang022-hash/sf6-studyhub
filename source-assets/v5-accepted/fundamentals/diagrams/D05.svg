<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 555" role="img" aria-label="Drive 是共享预算，不是每个按钮各有一条气"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">Drive 是共享预算，不是每个按钮各有一条气</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="155" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="209" y="140" class="label" text-anchor="middle" style="fill:white">1</text><rect x="275" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="329" y="140" class="label" text-anchor="middle" style="fill:white">2</text><rect x="395" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="449" y="140" class="label" text-anchor="middle" style="fill:white">3</text><rect x="515" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="569" y="140" class="label" text-anchor="middle" style="fill:white">4</text><rect x="635" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="689" y="140" class="label" text-anchor="middle" style="fill:white">5</text><rect x="755" y="110" width="108" height="45" rx="8" fill="#176b70"/><text x="809" y="140" class="label" text-anchor="middle" style="fill:white">6</text><text x="520" y="192" class="body" text-anchor="middle">同一条六格资源，同时支撑进攻与防守。</text><rect x="35" y="235" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="51" y="265" class="label" text-anchor="start">DI · 1格</text><text x="51" y="294" class="body" text-anchor="start">霸体接触 / 反DI / 版边威胁</text><rect x="375" y="235" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="391" y="265" class="label" text-anchor="start">OD · 通常2格</text><text x="391" y="294" class="body" text-anchor="start">强化必杀；属性逐招看</text><rect x="715" y="235" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="731" y="265" class="label" text-anchor="start">DRC · 3格</text><text x="731" y="294" class="body" text-anchor="start">把拳脚接触变成连段或压力</text><rect x="35" y="365" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="51" y="395" class="label" text-anchor="start">裸DR · 最少约1格</text><text x="51" y="424" class="body" text-anchor="start">先招架再冲；久按有额外成本</text><rect x="375" y="365" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="391" y="395" class="label" text-anchor="start">斗反 · 2格</text><text x="391" y="424" class="body" text-anchor="start">防御中 / 允许的起身情景脱困</text><rect x="715" y="365" width="290" height="104" rx="12" fill="white" stroke="#cddcde"/><text x="731" y="395" class="label" text-anchor="start">Parry · 起动＋持续成本</text><text x="731" y="424" class="body" text-anchor="start">防住回槽；空按可被投惩罚</text><text x="32" y="525" class="small" text-anchor="start">预算例：3格Drive → OD后约1格；若改为DRC，可能主动进入Burnout。</text></svg>