<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="确认：不要把四种问题混成一种“反应慢”"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">确认：不要把四种问题混成一种“反应慢”</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="30" y="125" width="304" height="143" rx="12" fill="white" stroke="#cddcde"/><text x="46" y="155" class="label" text-anchor="start">① 是否接触</text><text x="46" y="184" class="body" text-anchor="start">命中 / 被防 / 挥空</text><text x="46" y="209" class="body" text-anchor="start">普通必杀复合可过滤部分挥空</text><rect x="368" y="125" width="304" height="143" rx="12" fill="white" stroke="#cddcde"/><text x="384" y="155" class="label" text-anchor="start">② 是否真正命中</text><text x="384" y="184" class="body" text-anchor="start">只在命中时提交危险末键</text><text x="384" y="209" class="body" text-anchor="start">被防可以选择停手或安全后续</text><rect x="706" y="125" width="304" height="143" rx="12" fill="white" stroke="#cddcde"/><text x="722" y="155" class="label" text-anchor="start">③ 哪一种命中</text><text x="722" y="184" class="body" text-anchor="start">普通 / CH / PC / 浮空</text><text x="722" y="209" class="body" text-anchor="start">能接什么仍受距离约束</text><path d="M334,194 L359,194" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M672,194 L697,194" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><rect x="80" y="330" width="880" height="130" rx="12" fill="white" stroke="#cddcde"/><text x="96" y="360" class="label" text-anchor="start">三下攻击 ≠ 永远拥有三下确认时间</text><text x="96" y="389" class="body" text-anchor="start">5LP 被挡 → 2LK 打到后走 → 5LP：真正可确认只剩后两下。</text><text x="96" y="414" class="body" text-anchor="start">先稳定单一开防点，再练中途改变结果的轻链。</text><text x="32" y="526" class="small" text-anchor="start">S05 的关键教学细节：确认时间由“最后可能改变结果的点”决定。</text></svg>