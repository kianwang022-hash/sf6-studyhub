<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 595" role="img" aria-label="立回三要素：每种选择都放弃了一个理想条件"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">立回三要素：每种选择都放弃了一个理想条件</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><rect x="352" y="110" width="335" height="112" rx="12" fill="white" stroke="#cddcde"/><text x="368" y="140" class="label" text-anchor="start">进击：走进能碰到的位置</text><text x="368" y="169" class="body" text-anchor="start">不白白空挥，但接近需要时间</text><rect x="55" y="360" width="335" height="112" rx="12" fill="white" stroke="#cddcde"/><text x="71" y="390" class="label" text-anchor="start">差合：等对手先挥空</text><text x="71" y="419" class="body" text-anchor="start">利用恢复；没出手就没有靶子</text><rect x="655" y="360" width="335" height="112" rx="12" fill="white" stroke="#cddcde"/><text x="671" y="390" class="label" text-anchor="start">先制：提前把招放在路上</text><text x="671" y="419" class="body" text-anchor="start">抢先占路；对手停下会挥空</text><path d="M650,360 L618,230" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="717" y="288" class="small" text-anchor="start">先制截进击</text><path d="M400,421 L655,421" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="521" y="402" class="small" text-anchor="middle">差合罚先制</text><path d="M420,222 L283,349" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="185" y="285" class="small" text-anchor="start">进击逼差合</text><text x="520" y="533" class="body" text-anchor="middle">克制关系成立要有距离与时机；不是随机选一个图标比大小。</text><text x="520" y="563" class="small" text-anchor="middle">保留S11原术语“进击／先制／差合”，不替换成泛泛的“主动／被动”。</text></svg>