<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 515" role="img" aria-label="有利帧是时间优势，不是无限回合许可证"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">有利帧是时间优势，不是无限回合许可证</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><text x="60" y="130" class="label" text-anchor="start">你有利</text><text x="270" y="130" class="label" text-anchor="start">后招发生</text><text x="490" y="130" class="label" text-anchor="start">S − A</text><text x="680" y="130" class="label" text-anchor="start">与4F普通技比较</text><path d="M45 193 H995" stroke="#dce6e7"/><text x="60" y="178" class="body" text-anchor="start">+1</text><text x="270" y="178" class="body" text-anchor="start">4F轻拳</text><text x="490" y="178" class="body" text-anchor="start">3F</text><text x="680" y="178" class="body" text-anchor="start">先打到</text><path d="M45 241 H995" stroke="#dce6e7"/><text x="60" y="226" class="body" text-anchor="start">+2</text><text x="270" y="226" class="body" text-anchor="start">5F下轻脚／投</text><text x="490" y="226" class="body" text-anchor="start">3F</text><text x="680" y="226" class="body" text-anchor="start">先打到的条件成立</text><path d="M45 289 H995" stroke="#dce6e7"/><text x="60" y="274" class="body" text-anchor="start">+2</text><text x="270" y="274" class="body" text-anchor="start">6F中拳</text><text x="490" y="274" class="body" text-anchor="start">4F</text><text x="680" y="274" class="body" text-anchor="start">同帧，相杀候选</text><path d="M45 337 H995" stroke="#dce6e7"/><text x="60" y="322" class="body" text-anchor="start">+3</text><text x="270" y="322" class="body" text-anchor="start">7F后重拳</text><text x="490" y="322" class="body" text-anchor="start">4F</text><text x="680" y="322" class="body" text-anchor="start">同帧，相杀候选</text><path d="M45 385 H995" stroke="#dce6e7"/><text x="60" y="370" class="body" text-anchor="start">+3</text><text x="270" y="370" class="body" text-anchor="start">20F前重拳</text><text x="490" y="370" class="body" text-anchor="start">17F</text><text x="680" y="370" class="body" text-anchor="start">明显有空档，属于偷回合</text><text x="45" y="453" class="small" text-anchor="start">前提：双方都够得到、最速输入、无无敌等特殊属性。投另查投距与投保护。</text><text x="45" y="482" class="small" text-anchor="start">“能压4F”≠“没有可行动缝”；无敌技可能穿过同一个间隙。</text></svg>