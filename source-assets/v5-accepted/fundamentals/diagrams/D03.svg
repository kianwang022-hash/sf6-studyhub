<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" role="img" aria-label="目押与取消：两种不同的时间安排"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">目押与取消：两种不同的时间安排</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><text x="35" y="135" class="label" text-anchor="start">目押 Link</text><rect x="205" y="110" width="130" height="38" rx="5" fill="#176b70"/><text x="270.0" y="135" class="small" text-anchor="middle" style="fill:white">前招攻击</text><rect x="338" y="110" width="245" height="38" rx="5" fill="#386fb2"/><text x="460.5" y="135" class="small" text-anchor="middle" style="fill:white">前招恢复</text><rect x="586" y="110" width="220" height="38" rx="5" fill="#c18735"/><text x="696.0" y="135" class="small" text-anchor="middle" style="fill:white">后招开始</text><rect x="205" y="166" width="665" height="38" rx="5" fill="#766c96"/><text x="537.5" y="191" class="small" text-anchor="middle" style="fill:white">对手仍处于受击硬直 → 后招必须及时碰到</text><text x="208" y="232" class="body" text-anchor="start">前招做完再接；命中优势够，距离也必须够。</text><text x="35" y="316" class="label" text-anchor="start">取消 Cancel</text><rect x="205" y="290" width="130" height="38" rx="5" fill="#176b70"/><text x="270.0" y="315" class="small" text-anchor="middle" style="fill:white">前招攻击</text><rect x="338" y="290" width="150" height="38" rx="5" fill="#c18735"/><text x="413.0" y="315" class="small" text-anchor="middle" style="fill:white">后招启动</text><rect x="491" y="290" width="130" height="38" rx="5" fill="#b84c49"/><text x="556.0" y="315" class="small" text-anchor="middle" style="fill:white">后招攻击</text><rect x="625" y="290" width="245" height="38" fill="none" stroke="#386fb2" stroke-dasharray="8 5"/><text x="747" y="315" class="small" text-anchor="middle">不再等待原来的恢复</text><text x="208" y="365" class="body" text-anchor="start">在指定窗口切换；能取消不代表一定连得上，也不保证安全。</text><rect x="205" y="400" width="665" height="80" rx="12" fill="white" stroke="#cddcde"/><text x="221" y="430" class="label" text-anchor="start">同一条连段可以同时包含两种连接</text><text x="221" y="459" class="body" text-anchor="start">隆：5MP &gt; 2MP xx 623HP</text><text x="32" y="510" class="small" text-anchor="start">S04：头顶计时条帮助找输入点；底部帧条帮助查连接；身体颜色提示取消权限。</text></svg>