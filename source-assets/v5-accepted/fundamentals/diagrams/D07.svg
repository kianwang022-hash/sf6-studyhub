<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="延迟拆：同一次输入，在三种局面里得到三种结果"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b70"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193442}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#596f7a}</style><rect width="100%" height="100%" rx="18" fill="#f5f8f8"/><text x="32" y="43" class="title">延迟拆：同一次输入，在三种局面里得到三种结果</text><text x="32" y="71" class="small">教学示意 · 非游戏实际判定框或逐帧测量</text><text x="35" y="155" class="label" text-anchor="start">对方先打</text><rect x="200" y="125" width="180" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="216" y="155" class="label" text-anchor="start">你先防住</text><rect x="420" y="125" width="345" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="436" y="155" class="label" text-anchor="start">稍晚按投，仍在防御硬直</text><rect x="805" y="125" width="200" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="821" y="155" class="label" text-anchor="start">没有真的出投</text><path d="M380,166 L414,166" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M766,166 L798,166" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="35" y="285" class="label" text-anchor="start">对方投</text><rect x="200" y="255" width="180" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="216" y="285" class="label" text-anchor="start">先保持防御</text><rect x="420" y="255" width="345" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="436" y="285" class="label" text-anchor="start">稍晚按投，落入拆投窗口</text><rect x="805" y="255" width="200" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="821" y="285" class="label" text-anchor="start">拆投</text><path d="M380,296 L414,296" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M766,296 L798,296" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="35" y="415" class="label" text-anchor="start">对方后退</text><rect x="200" y="385" width="180" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="216" y="415" class="label" text-anchor="start">你先等一下</text><rect x="420" y="385" width="345" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="436" y="415" class="label" text-anchor="start">稍晚按投，但对方没碰你</text><rect x="805" y="385" width="200" height="85" rx="12" fill="white" stroke="#cddcde"/><text x="821" y="415" class="label" text-anchor="start">投挥空 → 可被惩罚</text><path d="M380,426 L414,426" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><path d="M766,426 L798,426" fill="none" stroke="#176b70" stroke-width="2.4" marker-end="url(#arr)"/><text x="32" y="529" class="small" text-anchor="start">时间关系示意，不是通用第几帧脚本。前置、打点、投时点和缓冲都影响覆盖。</text></svg>