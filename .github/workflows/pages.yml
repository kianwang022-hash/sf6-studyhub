name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages URL
        shell: bash
        run: |
          root='${{ steps.deployment.outputs.page_url }}'
          root="${root%/}"
          echo "Pages root: $root"

          verify() {
            url="$1"
            needle="$2"
            for i in {1..12}; do
              code=$(curl -L -sS -o /tmp/sf6-page.html -w '%{http_code}' "$url" || true)
              echo "url=$url attempt=$i http=$code"
              if [ "$code" = "200" ] && grep -q "$needle" /tmp/sf6-page.html; then
                return 0
              fi
              sleep 5
            done
            echo "VERIFY_FAIL $url"
            head -c 500 /tmp/sf6-page.html || true
            return 1
          }

          verify "$root/" 'SF6 StudyHub'

          curl -L -fsS "$root/" -o /tmp/sf6-home.html
          selector_count=$(grep -o '<option' /tmp/sf6-home.html | wc -l | tr -d ' ')
          echo "selector options=$selector_count"
          if [ "$selector_count" != "31" ]; then
            echo "VERIFY_FAIL selector expected=31 actual=$selector_count"
            exit 1
          fi

          slugs=(
            ryu luke jamie chunli guile kimberly juri ken blanka dhalsim
            ehonda deejay manon marisa jp zangief lily cammy
            rashid aki ed akuma
            vega terry mai elena
            sagat cviper alex ingrid
            yasmine
          )

          verify_asset() {
            url="$1"
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$url" || true)
            echo "asset=$url http=$code"
            if [ "$code" != "200" ]; then
              echo "VERIFY_FAIL asset $url"
              return 1
            fi
          }

          for slug in "${slugs[@]}"; do
            verify "$root/character/$slug/" 'ROLE · 角色理解'
            verify_asset "$root/hero/$slug-light.jpg"
            verify_asset "$root/hero/$slug-dark.jpg"
          done

          echo 'PUBLIC_PAGES_VERIFY_PASS | home + 31 selector options + 31 character pages + 62 hero assets'
